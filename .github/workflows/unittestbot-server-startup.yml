name: UnitTestBot server startup feasibility

on:
  workflow_dispatch:

  push:
    branches:
      - research/maintain-power-plus-unittestbot
    paths:
      - ".github/workflows/unittestbot-server-startup.yml"

permissions:
  contents: read

jobs:
  unit-test-bot-server-startup:
    name: Start and verify UnitTestBot server
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    env:
      UTBOT_VERSION: "2024.3.0"
      UTBOT_PORT: "2121"
      UTBOT_WORK_DIR: "${{ github.workspace }}/utbot-server-startup"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create working directories
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "${UTBOT_WORK_DIR}/release"
          mkdir -p "${UTBOT_WORK_DIR}/extracted/release"
          mkdir -p "${UTBOT_WORK_DIR}/extracted/distribution"
          mkdir -p "${UTBOT_WORK_DIR}/evidence"

      - name: Record environment information
        shell: bash
        run: |
          set -o pipefail
          {
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Branch or tag: ${GITHUB_REF_NAME}"
            echo "Commit: ${GITHUB_SHA}"
            echo "UnitTestBot version: ${UTBOT_VERSION}"
            echo "UnitTestBot port: ${UTBOT_PORT}"
            echo
            cat /etc/os-release
            echo
            uname -a
          } 2>&1 | tee "${UTBOT_WORK_DIR}/evidence/environment.txt"

      - name: Verify clean experimental starting point
        shell: bash
        run: |
          set -o pipefail
          {
            if find . -type f -name "generated_maintain_power_tests.cpp" \
              -not -path "./utbot-server-startup/*" \
              -print | grep -q .; then
              echo "ERROR: generated_maintain_power_tests.cpp is already present."
              find . -type f -name "generated_maintain_power_tests.cpp" \
                -not -path "./utbot-server-startup/*" \
                -print
              exit 1
            fi

            if [ ! -f "CMakeLists.txt" ]; then
              echo "ERROR: root CMakeLists.txt was not found."
              exit 1
            fi

            if [ -e "build" ]; then
              echo "ERROR: a root build path already exists before the server test."
              ls -ld build
              exit 1
            fi

            echo "No generated MaintainPowerInterface test file is present."
            echo "Root CMakeLists.txt found."
            echo "No root build path is present."
          } 2>&1 | tee "${UTBOT_WORK_DIR}/evidence/start-point-check.txt"

      - name: Install server test dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates \
            curl \
            file \
            jq \
            lsb-release \
            netcat-openbsd \
            procps \
            tar \
            unzip

      - name: Download UnitTestBot release archive
        shell: bash
        run: |
          set -euxo pipefail

          RELEASE_API_URL="https://api.github.com/repos/UnitTestBot/UTBotCpp/releases/tags/${UTBOT_VERSION}"
          RELEASE_JSON="${UTBOT_WORK_DIR}/release/release-${UTBOT_VERSION}.json"
          ASSET_NAME="utbot-release-${UTBOT_VERSION}.zip"

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${RELEASE_API_URL}" \
            --output "${RELEASE_JSON}"

          ASSET_URL="$(
            jq -r \
              --arg name "${ASSET_NAME}" \
              '.assets[] | select(.name == $name) | .browser_download_url' \
              "${RELEASE_JSON}"
          )"

          if [ -z "${ASSET_URL}" ] || [ "${ASSET_URL}" = "null" ]; then
            echo "ERROR: release asset ${ASSET_NAME} was not found."
            exit 1
          fi

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            "${ASSET_URL}" \
            --output "${UTBOT_WORK_DIR}/release/${ASSET_NAME}"

          ls -lh "${UTBOT_WORK_DIR}/release/${ASSET_NAME}" \
            | tee "${UTBOT_WORK_DIR}/evidence/downloaded-asset.txt"

      - name: Extract UnitTestBot distribution
        shell: bash
        run: |
          set -o pipefail
          {
            OUTER_ARCHIVE="${UTBOT_WORK_DIR}/release/utbot-release-${UTBOT_VERSION}.zip"
            RELEASE_DIR="${UTBOT_WORK_DIR}/extracted/release"
            DISTRIBUTION_DIR="${UTBOT_WORK_DIR}/extracted/distribution"

            unzip -q "${OUTER_ARCHIVE}" -d "${RELEASE_DIR}"

            INNER_ARCHIVE="${RELEASE_DIR}/utbot_distr.tar.gz"
            if [ ! -f "${INNER_ARCHIVE}" ]; then
              echo "ERROR: utbot_distr.tar.gz was not found."
              exit 1
            fi

            tar -xzf "${INNER_ARCHIVE}" -C "${DISTRIBUTION_DIR}"

            UTBOT_ROOT="${DISTRIBUTION_DIR}/utbot_distr"
            if [ ! -d "${UTBOT_ROOT}" ]; then
              echo "ERROR: extracted utbot_distr directory was not found."
              exit 1
            fi

            echo "UnitTestBot distribution extracted to:"
            echo "${UTBOT_ROOT}"
            du -sh "${UTBOT_ROOT}"
          } 2>&1 | tee "${UTBOT_WORK_DIR}/evidence/distribution-extraction.txt"

      - name: Prepare UnitTestBot scripts
        shell: bash
        run: |
          set -euxo pipefail

          UTBOT_ROOT="${UTBOT_WORK_DIR}/extracted/distribution/utbot_distr"

          chmod +x \
            "${UTBOT_ROOT}/utbot_server_restart.sh" \
            "${UTBOT_ROOT}/utbot_run_system.sh" \
            "${UTBOT_ROOT}/utbot_online_cli.sh"

          file \
            "${UTBOT_ROOT}/utbot_server_restart.sh" \
            "${UTBOT_ROOT}/utbot_run_system.sh" \
            "${UTBOT_ROOT}/utbot_online_cli.sh" \
            "${UTBOT_ROOT}/server-install/utbot" \
            | tee "${UTBOT_WORK_DIR}/evidence/prepared-files.txt"

      - name: Verify bundled runtime libraries
        shell: bash
        run: |
          set -o pipefail
          {
            UTBOT_ROOT="${UTBOT_WORK_DIR}/extracted/distribution/utbot_distr"
            export LD_LIBRARY_PATH="${UTBOT_ROOT}/install/lib:${UTBOT_ROOT}/debs-install/lib/x86_64-linux-gnu:${UTBOT_ROOT}/debs-install/usr/lib/x86_64-linux-gnu:${UTBOT_ROOT}/debs-install/usr/local/lib:${UTBOT_ROOT}/debs-install/lib:${UTBOT_ROOT}/debs-install/usr/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"

            echo "Shared-library resolution with UnitTestBot environment:"
            ldd "${UTBOT_ROOT}/server-install/utbot"
            echo

            if ldd "${UTBOT_ROOT}/server-install/utbot" | grep -q "not found"; then
              echo "ERROR: unresolved UnitTestBot server libraries remain."
              exit 1
            fi

            echo "All direct UnitTestBot server libraries are resolved."
          } 2>&1 | tee "${UTBOT_WORK_DIR}/evidence/runtime-library-check.txt"

      - name: Check port availability before startup
        shell: bash
        run: |
          set -o pipefail
          {
            if nc -z 127.0.0.1 "${UTBOT_PORT}"; then
              echo "ERROR: port ${UTBOT_PORT} is already listening before UnitTestBot startup."
              exit 1
            fi

            echo "Port ${UTBOT_PORT} is free before UnitTestBot startup."
          } 2>&1 | tee "${UTBOT_WORK_DIR}/evidence/port-before-startup.txt"

      - name: Start UnitTestBot server
        id: start_server
        shell: bash
        run: |
          set -o pipefail

          UTBOT_ROOT="${UTBOT_WORK_DIR}/extracted/distribution/utbot_distr"

          {
            echo "Starting UnitTestBot server on port ${UTBOT_PORT}."
            cd "${UTBOT_ROOT}"

            timeout 20s ./utbot_server_restart.sh "${UTBOT_PORT}"
            START_STATUS=$?

            echo "Launcher exit status: ${START_STATUS}"

            if [ "${START_STATUS}" -ne 0 ]; then
              echo "ERROR: UnitTestBot server launcher failed."
              exit "${START_STATUS}"
            fi
          } 2>&1 | tee "${UTBOT_WORK_DIR}/evidence/server-startup-command.txt"

      - name: Verify UnitTestBot server process and port
        shell: bash
        run: |
          set -o pipefail
          {
            UTBOT_ROOT="${UTBOT_WORK_DIR}/extracted/distribution/utbot_distr"
            PID_FILE="${UTBOT_ROOT}/server-install/utbot.pid"

            echo "Waiting for UnitTestBot server readiness."

            PROCESS_READY=0
            PORT_READY=0

            for ATTEMPT in $(seq 1 15); do
              echo "Readiness attempt ${ATTEMPT}/15"

              if [ -s "${PID_FILE}" ]; then
                SERVER_PID="$(cat "${PID_FILE}")"
                if kill -0 "${SERVER_PID}" 2>/dev/null; then
                  PROCESS_READY=1
                fi
              fi

              if nc -z 127.0.0.1 "${UTBOT_PORT}"; then
                PORT_READY=1
              fi

              if [ "${PROCESS_READY}" -eq 1 ] && [ "${PORT_READY}" -eq 1 ]; then
                break
              fi

              sleep 2
            done

            echo
            echo "PID file: ${PID_FILE}"
            if [ -f "${PID_FILE}" ]; then
              cat "${PID_FILE}"
            else
              echo "PID file is absent."
            fi

            echo
            echo "Matching processes:"
            ps aux | grep "[u]tbot.*server" || true

            echo
            echo "Listening sockets on port ${UTBOT_PORT}:"
            ss -ltnp | grep ":${UTBOT_PORT}" || true

            echo
            echo "Process ready: ${PROCESS_READY}"
            echo "Port ready: ${PORT_READY}"

            if [ "${PROCESS_READY}" -ne 1 ]; then
              echo "ERROR: UnitTestBot server process is not running."
              exit 1
            fi

            if [ "${PORT_READY}" -ne 1 ]; then
              echo "ERROR: UnitTestBot server is not listening on port ${UTBOT_PORT}."
              exit 1
            fi

            echo "UnitTestBot server startup is validated."
          } 2>&1 | tee "${UTBOT_WORK_DIR}/evidence/server-readiness.txt"

      - name: Collect UnitTestBot server evidence
        if: always()
        shell: bash
        run: |
          set +e

          UTBOT_ROOT="${UTBOT_WORK_DIR}/extracted/distribution/utbot_distr"
          PID_FILE="${UTBOT_ROOT}/server-install/utbot.pid"

          {
            echo "Collected at: $(date --iso-8601=seconds)"
            echo
            echo "UnitTestBot processes:"
            ps aux | grep "[u]tbot" || true
            echo
            echo "Listening sockets:"
            ss -ltnp | grep ":${UTBOT_PORT}" || true
            echo
            echo "PID file:"
            if [ -f "${PID_FILE}" ]; then
              cat "${PID_FILE}"
            else
              echo "PID file is absent."
            fi
          } > "${UTBOT_WORK_DIR}/evidence/server-state.txt" 2>&1

          if [ -d "${UTBOT_ROOT}/logs" ]; then
            cp -a "${UTBOT_ROOT}/logs" "${UTBOT_WORK_DIR}/evidence/utbot-logs"
          fi

          find "${UTBOT_ROOT}" \
            -maxdepth 2 \
            -type f \
            \( -name "*.log" -o -name "*.pid" \) \
            -printf '%M\t%s\t%p\n' \
            | sort \
            > "${UTBOT_WORK_DIR}/evidence/log-and-pid-inventory.txt"

      - name: Stop UnitTestBot server
        if: always()
        shell: bash
        run: |
          set +e

          UTBOT_ROOT="${UTBOT_WORK_DIR}/extracted/distribution/utbot_distr"
          PID_FILE="${UTBOT_ROOT}/server-install/utbot.pid"
          STOP_LOG="${UTBOT_WORK_DIR}/evidence/server-shutdown.txt"

          {
            if [ ! -s "${PID_FILE}" ]; then
              echo "No UnitTestBot PID file was found."
              exit 0
            fi

            SERVER_PID="$(cat "${PID_FILE}")"
            echo "Stopping UnitTestBot server PID ${SERVER_PID}."

            if kill -0 "${SERVER_PID}" 2>/dev/null; then
              kill "${SERVER_PID}"

              for ATTEMPT in $(seq 1 10); do
                if ! kill -0 "${SERVER_PID}" 2>/dev/null; then
                  break
                fi
                sleep 1
              done
            fi

            if kill -0 "${SERVER_PID}" 2>/dev/null; then
              echo "Server did not stop after SIGTERM. Sending SIGKILL."
              kill -9 "${SERVER_PID}" || true
            fi

            rm -f "${PID_FILE}"

            if nc -z 127.0.0.1 "${UTBOT_PORT}"; then
              echo "WARNING: port ${UTBOT_PORT} is still listening after shutdown."
            else
              echo "Port ${UTBOT_PORT} is closed after shutdown."
            fi
          } 2>&1 | tee "${STOP_LOG}"

      - name: Upload UnitTestBot server startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unittestbot-server-startup-evidence
          path: |
            utbot-server-startup/evidence
            utbot-server-startup/release/*.json
          if-no-files-found: warn
          retention-days: 30
