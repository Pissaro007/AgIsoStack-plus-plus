name: Mull - Edit and Validate Language Command Getter Boundary Mutants with Aider v3

on:
  workflow_dispatch:
    inputs:
      source_file:
        description: "Chemin du fichier source a muter"
        required: true
        default: "isobus/src/isobus_language_command_interface.cpp"
        type: string

  push:
    branches:
      - quality/mull-isobus-language-command-interface
    paths:
      - .github/workflows/mull-language-command-interface-getter-boundary-aider-edit-and-validate-v3.yml

permissions:
  contents: read

env:
  SOURCE_FILE: ${{ inputs.source_file || 'isobus/src/isobus_language_command_interface.cpp' }}
  TEST_EXECUTABLE: build/test/unit_tests
  TEST_FILTER: LanguageCommandInterfaceTest.*
  TARGET_LINES: "144 148 167 171"
  KILLABLE_TARGETS: "144:cxx_gt_to_le 148:cxx_lt_to_ge 167:cxx_gt_to_le 171:cxx_lt_to_ge"

jobs:
  mutation-testing:
    name: Enrich existing test and validate getter boundary mutants
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Clang 19 Mull and build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang-19 llvm-19 build-essential cmake ninja-build curl python3-pip
          curl -1sLf "https://dl.cloudsmith.io/public/mull-project/mull-stable/setup.deb.sh" | sudo -E bash
          sudo apt-get update
          sudo apt-get install -y mull-19

      - name: Locate existing language command test file
        shell: bash
        run: |
          set -euo pipefail
          TEST_FILE=$(grep -Rsl "LanguageCommandInterfaceTest" test | head -n 1 || true)
          if [ -z "${TEST_FILE}" ]; then
            echo "Could not find an existing LanguageCommandInterfaceTest file under test/." >&2
            exit 1
          fi
          echo "TEST_FILE=${TEST_FILE}" >> "${GITHUB_ENV}"
          echo "Using test file: ${TEST_FILE}"

      - name: Verify tools and input files
        shell: bash
        run: |
          set -euo pipefail
          clang-19 --version
          llvm-profdata-19 --version
          llvm-cov-19 --version
          mull-runner-19 --version
          test -f /usr/lib/mull-ir-frontend-19
          test -f "${SOURCE_FILE}"
          test -f "${TEST_FILE}"

      - name: Create Mull configuration
        shell: bash
        run: |
          set -euo pipefail
          ESCAPED_SOURCE_FILE=$(printf '%s' "${SOURCE_FILE}" | sed 's#[][\\.^$*+?(){}|]#\\&#g')
          cat > mull-config.yml <<EOF
          includePaths:
            - '.*${ESCAPED_SOURCE_FILE}$'
          excludePaths:
            - '.*googletest.*'
            - '.*googlemock.*'
            - '.*gtest.*'
            - '.*gmock.*'
          quiet: false
          EOF
          cat mull-config.yml

      - name: Configure tests for Mull
        shell: bash
        env:
          CC: clang-19
          CXX: clang++-19
          MULL_CONFIG: ${{ github.workspace }}/mull-config.yml
        run: |
          set -euo pipefail
          cmake -S . -B build \
            -G Ninja \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_FLAGS="-O0 -g -grecord-command-line -fprofile-instr-generate -fcoverage-mapping -fpass-plugin=/usr/lib/mull-ir-frontend-19" \
            -DCMAKE_CXX_FLAGS="-O0 -g -grecord-command-line -fprofile-instr-generate -fcoverage-mapping -fpass-plugin=/usr/lib/mull-ir-frontend-19" \
            -DCMAKE_EXE_LINKER_FLAGS="-fprofile-instr-generate"

      - name: Compile unit tests
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --parallel
          test -x "${TEST_EXECUTABLE}"

      - name: Run focused baseline language command tests
        shell: bash
        run: |
          set -euo pipefail
          cd build/test
          ./unit_tests --gtest_filter="${TEST_FILTER}" --gtest_color=no 2>&1 | tee "${GITHUB_WORKSPACE}/language-command-tests-before-aider.log"

      - name: Run baseline Mull campaign on language command interface
        shell: bash
        env:
          MULL_CONFIG: ${{ github.workspace }}/mull-config.yml
        run: |
          set -euo pipefail
          rm -rf mull-results-before-aider
          mkdir -p mull-results-before-aider
          cd build/test
          mull-runner-19 \
            --allow-surviving \
            --ide-reporter-show-killed \
            --debug \
            --timeout 120000 \
            --reporters IDE \
            --reporters Elements \
            --report-dir "${GITHUB_WORKSPACE}/mull-results-before-aider" \
            --report-name language-command-before-aider-getters \
            ./unit_tests \
            --gtest_filter="${TEST_FILTER}" \
            --gtest_color=no \
            2>&1 | tee "${GITHUB_WORKSPACE}/mull-results-before-aider/mull-console.log"

      - name: Verify killable target mutants survive before Aider
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          source = os.environ["SOURCE_FILE"].replace("\\", "/")
          killable = set()
          for item in os.environ["KILLABLE_TARGETS"].split():
              line, operator = item.split(":", 1)
              killable.add((int(line), operator))

          log = Path("mull-results-before-aider/mull-console.log").read_text(encoding="utf-8", errors="replace")
          pattern = re.compile(
              r"(?:^|\s)(cxx_[A-Za-z0-9_]+):"
              r"(.+?):(\d+):(\d+):\d+:\d+\s+->\s+(Passed|Failed)"
          )
          rows = []
          for operator, path, line, column, status in pattern.findall(log):
              normalized = path.replace("\\", "/")
              key = (int(line), operator)
              if normalized.endswith(source) and key in killable:
                  rows.append((operator, int(line), int(column), status))

          survivors = [row for row in rows if row[3] == "Passed"]
          if not survivors:
              raise SystemExit("No killable target mutant was found surviving before Aider.")

          print("Confirmed surviving killable target mutants:")
          for row in survivors:
              print(row)
          PY

      - name: Generate focused context for Aider
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          source = Path(os.environ["SOURCE_FILE"])
          target_lines = [int(x) for x in os.environ["TARGET_LINES"].split()]
          lines = source.read_text(encoding="utf-8", errors="replace").splitlines()
          selected = set()
          context_ranges = []

          for target in target_lines:
              start = max(1, target - 10)
              end = min(len(lines), target + 10)
              context_ranges.append({"target_line": target, "start": start, "end": end})
              selected.update(range(start, end + 1))

          context = {
              "target_mutants": {
                  "file": source.as_posix(),
                  "all_boundary_lines": target_lines,
                  "killable_operators_to_validate": {
                      "144": ["cxx_gt_to_le"],
                      "148": ["cxx_lt_to_ge"],
                      "167": ["cxx_gt_to_le"],
                      "171": ["cxx_lt_to_ge"]
                  },
                  "likely_equivalent_or_non_observable_operators": {
                      "144": ["cxx_gt_to_ge"],
                      "148": ["cxx_lt_to_le"],
                      "167": ["cxx_gt_to_ge"],
                      "171": ["cxx_lt_to_le"]
                  },
                  "known_test_suite": "LanguageCommandInterfaceTest"
              },
              "public_getters_to_use": [
                  "get_country_code()",
                  "get_language_code()"
              ],
              "required_getter_assertions": {
                  "country": {
                      "empty_string": {"input": "", "expected": "  "},
                      "length_1": {"input": "F", "expected": "F "},
                      "length_2": {"input": "FR", "expected": "FR"},
                      "length_3": {"input": "FRA", "expected": "FR"}
                  },
                  "language": {
                      "empty_string": {"input": "", "expected": "  "},
                      "length_1": {"input": "f", "expected": "f "},
                      "length_2": {"input": "fr", "expected": "fr"},
                      "length_3": {"input": "fra", "expected": "fr"}
                  }
              },
              "source_context": [
                  {"line": n, "is_target": n in target_lines, "content": lines[n - 1]}
                  for n in sorted(selected)
              ]
          }

          Path("agent-language-command-getter-boundary-context.json").write_text(
              json.dumps(context, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8"
          )
          PY
          python3 -m json.tool agent-language-command-getter-boundary-context.json

      - name: Install Aider
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user aider-chat
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Record test baseline before Aider
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["TEST_FILE"])
          content = path.read_text(encoding="utf-8", errors="replace")
          count = len(re.findall(r"\bTEST(?:_F|_P)?\s*\(", content))
          Path("baseline-test-count.txt").write_text(f"{count}\n", encoding="utf-8")
          print(f"Existing GoogleTest declaration count: {count}")
          PY

      - name: Analyze and enrich existing language command test with Aider
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          PROMPT=$(cat <<'EOF'
          Analyse les mutants Mull survivants decrits dans agent-language-command-getter-boundary-context.json.

          Objectif : tuer les mutants de bornes observables situes aux lignes 144, 148, 167 et 171 de
          isobus/src/isobus_language_command_interface.cpp en enrichissant uniquement un test existant
          de la suite LanguageCommandInterfaceTest.

          Important : le precedent patch verifiait seulement les octets de la trame CAN. Cela ne suffit pas,
          car la trame n'expose que deux caracteres et certaines differences restent invisibles.

          Correction attendue : utilise directement les getters publics get_country_code() et get_language_code()
          juste apres les setters pour verifier l'etat interne normalise.

          Ajoute obligatoirement ces assertions directes, dans un test existant de LanguageCommandInterfaceTest :

          Country code :
          - set_country_code("") puis EXPECT_EQ("  ", get_country_code()) ;
          - set_country_code("F") puis EXPECT_EQ("F ", get_country_code()) ;
          - set_country_code("FR") puis EXPECT_EQ("FR", get_country_code()) ;
          - set_country_code("FRA") puis EXPECT_EQ("FR", get_country_code()) .

          Language code :
          - set_language_code("") puis EXPECT_EQ("  ", get_language_code()) ;
          - set_language_code("f") puis EXPECT_EQ("f ", get_language_code()) ;
          - set_language_code("fr") puis EXPECT_EQ("fr", get_language_code()) ;
          - set_language_code("fra") puis EXPECT_EQ("fr", get_language_code()) .

          Mutants que la validation cible explicitement :
          - ligne 144 : cxx_gt_to_le ;
          - ligne 148 : cxx_lt_to_ge ;
          - ligne 167 : cxx_gt_to_le ;
          - ligne 171 : cxx_lt_to_ge.

          Les mutants cxx_gt_to_ge sur les lignes 144 et 167, et cxx_lt_to_le sur les lignes 148 et 171,
          peuvent etre equivalents ou non observables avec l'API publique. Ne cherche pas a ajouter du code
          artificiel pour eux.

          Contraintes absolues :
          - modifie uniquement le fichier de test fourni en edition ;
          - enrichis uniquement un test existant de LanguageCommandInterfaceTest ;
          - ne cree aucun nouveau TEST, TEST_F ou TEST_P ;
          - ne modifie jamais le code de production ;
          - ne modifie aucun autre fichier ;
          - n'affaiblis, ne supprime et ne remplace aucune assertion existante ;
          - n'utilise aucune attente reelle ;
          - n'ajoute aucune dependance GoogleMock ;
          - utilise uniquement les API publiques et les assertions GoogleTest deja disponibles ;
          - applique la modification minimale necessaire.

          Le fichier de production et le contexte des mutants sont fournis en lecture seule.
          Le fichier de test est fourni en edition. Genere et applique toi-meme le patch uniquement dans ce fichier.
          EOF
          )

          aider \
            --model openrouter/nvidia/nemotron-3-ultra-550b-a55b:free \
            --edit-format diff \
            --read agent-language-command-getter-boundary-context.json \
            --read "${SOURCE_FILE}" \
            --file "${TEST_FILE}" \
            --message "${PROMPT}" \
            --no-gitignore \
            --map-tokens 0 \
            --no-check-update \
            --no-show-release-notes \
            --analytics-disable \
            --chat-history-file "${RUNNER_TEMP}/aider.chat.history.md" \
            --input-history-file "${RUNNER_TEMP}/aider.input.history" \
            --llm-history-file "${RUNNER_TEMP}/aider.llm.history" \
            --no-auto-commits \
            --no-dirty-commits \
            --no-pretty \
            --no-stream \
            --yes-always \
            2>&1 | tee aider-language-command-getter-boundary-edit.txt

          test -s aider-language-command-getter-boundary-edit.txt

      - name: Enforce Aider modification boundaries
        shell: bash
        run: |
          set -euo pipefail

          changed_files=$(git diff --name-only)
          if [ -z "${changed_files}" ]; then
            echo "Aider did not modify any tracked file." >&2
            exit 1
          fi

          while IFS= read -r changed_file; do
            if [ "${changed_file}" != "${TEST_FILE}" ]; then
              echo "Aider modified a tracked file other than ${TEST_FILE}: ${changed_file}" >&2
              git diff -- "${changed_file}" >&2
              exit 1
            fi
          done <<< "${changed_files}"

          if ! git diff --quiet -- "${SOURCE_FILE}"; then
            echo "Production code was modified." >&2
            exit 1
          fi

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["TEST_FILE"])
          content = path.read_text(encoding="utf-8", errors="replace")
          before = int(Path("baseline-test-count.txt").read_text().strip())
          after = len(re.findall(r"\bTEST(?:_F|_P)?\s*\(", content))
          if after != before:
              raise SystemExit(f"GoogleTest declaration count changed: before={before}, after={after}")
          if "get_country_code" not in content or "get_language_code" not in content:
              raise SystemExit("Expected getter assertions were not added.")
          print(f"GoogleTest declaration count unchanged: {after}")
          PY

          git diff --check
          git diff -- "${TEST_FILE}" | tee aider-language-command-getter-boundary.patch

      - name: Rebuild unit tests after Aider edit
        shell: bash
        run: |
          set -euo pipefail
          find build -type f -name '*.gcda' -delete
          cmake --build build --parallel
          test -x "${TEST_EXECUTABLE}"

      - name: Run enriched language command tests
        shell: bash
        run: |
          set -euo pipefail
          cd build/test
          ./unit_tests --gtest_filter="${TEST_FILTER}" --gtest_color=no 2>&1 | tee "${GITHUB_WORKSPACE}/language-command-tests-after-aider.log"

      - name: Run Mull campaign after Aider edit
        shell: bash
        env:
          MULL_CONFIG: ${{ github.workspace }}/mull-config.yml
        run: |
          set -euo pipefail
          rm -rf mull-results-after-aider
          mkdir -p mull-results-after-aider
          cd build/test
          mull-runner-19 \
            --allow-surviving \
            --ide-reporter-show-killed \
            --debug \
            --timeout 120000 \
            --reporters IDE \
            --reporters Elements \
            --report-dir "${GITHUB_WORKSPACE}/mull-results-after-aider" \
            --report-name language-command-after-aider-getter-boundaries \
            ./unit_tests \
            --gtest_filter="${TEST_FILTER}" \
            --gtest_color=no \
            2>&1 | tee "${GITHUB_WORKSPACE}/mull-results-after-aider/mull-console.log"

      - name: Verify killable targeted mutants and report remaining survivors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          source = os.environ["SOURCE_FILE"].replace("\\", "/")
          killable = set()
          for item in os.environ["KILLABLE_TARGETS"].split():
              line, operator = item.split(":", 1)
              killable.add((int(line), operator))

          log = Path("mull-results-after-aider/mull-console.log").read_text(
              encoding="utf-8", errors="replace"
          )
          pattern = re.compile(
              r"(?:^|\s)(cxx_[A-Za-z0-9_]+):"
              r"(.+?):(\d+):(\d+):\d+:\d+\s+->\s+(Passed|Failed)"
          )
          rows = []
          for operator, path, line, column, status in pattern.findall(log):
              normalized = path.replace("\\", "/")
              if normalized.endswith(source):
                  rows.append((operator, int(line), int(column), status))

          target_survivors = [row for row in rows if (row[1], row[0]) in killable and row[3] == "Passed"]
          if target_survivors:
              raise SystemExit(f"Killable targeted mutants still survive: {target_survivors}")

          surviving = sorted(row for row in rows if row[3] == "Passed")
          report = [
              "Killable target boundary mutants: killed.",
              "Validated targets: 144:cxx_gt_to_le, 148:cxx_lt_to_ge, 167:cxx_gt_to_le, 171:cxx_lt_to_ge",
              f"All surviving mutants after Aider: {len(surviving)}",
          ]
          report.extend(str(row) for row in surviving)
          Path("post-aider-mutation-summary.txt").write_text(
              "\n".join(report) + "\n", encoding="utf-8"
          )
          print("\n".join(report))
          PY

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Language command getter boundary mutants"
            echo
            echo '```text'
            cat post-aider-mutation-summary.txt 2>/dev/null || echo "Final mutation summary was not generated."
            echo '```'
            echo
            echo "## Authorized patch"
            echo
            echo '```diff'
            cat aider-language-command-getter-boundary.patch 2>/dev/null || echo "Aider patch was not generated."
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mull-language-command-getter-boundary-edit-and-validation-v3
          path: |
            mull-config.yml
            language-command-tests-before-aider.log
            mull-results-before-aider/
            agent-language-command-getter-boundary-context.json
            baseline-test-count.txt
            aider-language-command-getter-boundary-edit.txt
            aider-language-command-getter-boundary.patch
            language-command-tests-after-aider.log
            mull-results-after-aider/
            post-aider-mutation-summary.txt
          if-no-files-found: warn
          retention-days: 30
