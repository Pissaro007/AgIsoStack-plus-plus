name: Mull - Edit and Validate Language Command Line 302 with Aider v1

on:
  workflow_dispatch:
    inputs:
      source_file:
        description: "Chemin du fichier source a muter"
        required: true
        default: "isobus/src/isobus_language_command_interface.cpp"
        type: string

  push:
    branches:
      - quality/mull-isobus-language-command-interface
    paths:
      - .github/workflows/mull-language-command-interface-line-302-aider-edit-and-validate-v1.yml

permissions:
  contents: read

env:
  SOURCE_FILE: ${{ inputs.source_file || 'isobus/src/isobus_language_command_interface.cpp' }}
  TEST_EXECUTABLE: build/test/unit_tests
  TEST_FILTER: LanguageCommandInterfaceTest.*
  TARGET_LINE: "302"
  TARGET_OPERATORS: "cxx_ge_to_gt cxx_ge_to_lt"

jobs:
  mutation-testing:
    name: Enrich existing test and validate language command line 302 mutants
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Clang 19 Mull and build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang-19 llvm-19 build-essential cmake ninja-build curl python3-pip
          curl -1sLf "https://dl.cloudsmith.io/public/mull-project/mull-stable/setup.deb.sh" | sudo -E bash
          sudo apt-get update
          sudo apt-get install -y mull-19

      - name: Locate existing language command test file
        shell: bash
        run: |
          set -euo pipefail
          TEST_FILE=$(grep -Rsl "LanguageCommandInterfaceTest" test | head -n 1 || true)
          if [ -z "${TEST_FILE}" ]; then
            echo "Could not find an existing LanguageCommandInterfaceTest file under test/." >&2
            exit 1
          fi
          echo "TEST_FILE=${TEST_FILE}" >> "${GITHUB_ENV}"
          echo "Using test file: ${TEST_FILE}"

      - name: Verify tools and input files
        shell: bash
        run: |
          set -euo pipefail
          clang-19 --version
          llvm-profdata-19 --version
          llvm-cov-19 --version
          mull-runner-19 --version
          test -f /usr/lib/mull-ir-frontend-19
          test -f "${SOURCE_FILE}"
          test -f "${TEST_FILE}"

      - name: Create Mull configuration
        shell: bash
        run: |
          set -euo pipefail
          ESCAPED_SOURCE_FILE=$(printf '%s' "${SOURCE_FILE}" | sed 's#[][\\.^$*+?(){}|]#\\&#g')
          cat > mull-config.yml <<EOF
          includePaths:
            - '.*${ESCAPED_SOURCE_FILE}$'
          excludePaths:
            - '.*googletest.*'
            - '.*googlemock.*'
            - '.*gtest.*'
            - '.*gmock.*'
          quiet: false
          EOF
          cat mull-config.yml

      - name: Configure tests for Mull
        shell: bash
        env:
          CC: clang-19
          CXX: clang++-19
          MULL_CONFIG: ${{ github.workspace }}/mull-config.yml
        run: |
          set -euo pipefail
          cmake -S . -B build \
            -G Ninja \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_FLAGS="-O0 -g -grecord-command-line -fprofile-instr-generate -fcoverage-mapping -fpass-plugin=/usr/lib/mull-ir-frontend-19" \
            -DCMAKE_CXX_FLAGS="-O0 -g -grecord-command-line -fprofile-instr-generate -fcoverage-mapping -fpass-plugin=/usr/lib/mull-ir-frontend-19" \
            -DCMAKE_EXE_LINKER_FLAGS="-fprofile-instr-generate"

      - name: Compile unit tests
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --parallel
          test -x "${TEST_EXECUTABLE}"

      - name: Run focused baseline language command tests
        shell: bash
        run: |
          set -euo pipefail
          cd build/test
          ./unit_tests --gtest_filter="${TEST_FILTER}" --gtest_color=no 2>&1 | tee "${GITHUB_WORKSPACE}/language-command-tests-before-aider.log"

      - name: Run baseline Mull campaign on language command interface
        shell: bash
        env:
          MULL_CONFIG: ${{ github.workspace }}/mull-config.yml
        run: |
          set -euo pipefail
          rm -rf mull-results-before-aider
          mkdir -p mull-results-before-aider
          cd build/test
          mull-runner-19 \
            --allow-surviving \
            --ide-reporter-show-killed \
            --debug \
            --timeout 120000 \
            --reporters IDE \
            --reporters Elements \
            --report-dir "${GITHUB_WORKSPACE}/mull-results-before-aider" \
            --report-name language-command-before-aider-line-302 \
            ./unit_tests \
            --gtest_filter="${TEST_FILTER}" \
            --gtest_color=no \
            2>&1 | tee "${GITHUB_WORKSPACE}/mull-results-before-aider/mull-console.log"

      - name: Verify target line 302 mutants survive before Aider
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          source = os.environ["SOURCE_FILE"].replace("\\", "/")
          target_line = int(os.environ["TARGET_LINE"])
          target_operators = set(os.environ["TARGET_OPERATORS"].split())
          log = Path("mull-results-before-aider/mull-console.log").read_text(encoding="utf-8", errors="replace")
          pattern = re.compile(
              r"(?:^|\s)(cxx_[A-Za-z0-9_]+):"
              r"(.+?):(\d+):(\d+):\d+:\d+\s+->\s+(Passed|Failed)"
          )
          rows = []
          for operator, path, line, column, status in pattern.findall(log):
              normalized = path.replace("\\", "/")
              if normalized.endswith(source) and int(line) == target_line and operator in target_operators:
                  rows.append((operator, int(line), int(column), status))

          survivors = [row for row in rows if row[3] == "Passed"]
          if not survivors:
              raise SystemExit("No target mutant survived at line 302 before Aider.")

          print("Confirmed surviving target mutants at line 302:")
          for row in survivors:
              print(row)
          PY

      - name: Generate focused context for Aider
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          source = Path(os.environ["SOURCE_FILE"])
          target = int(os.environ["TARGET_LINE"])
          lines = source.read_text(encoding="utf-8", errors="replace").splitlines()
          start = max(1, target - 18)
          end = min(len(lines), target + 18)

          context = {
              "target_mutants": {
                  "file": source.as_posix(),
                  "line": target,
                  "operators": os.environ["TARGET_OPERATORS"].split(),
                  "expression": "languageCode.size() >= 2",
                  "known_test_suite": "LanguageCommandInterfaceTest",
                  "likely_existing_tests": [
                      "LanguageCommandInterfaceTest.MessageContentParsing",
                      "LanguageCommandInterfaceTest.SettersAndTransmitting"
                  ]
              },
              "expected_strategy": {
                  "focus": "exercise language command parsing or reception with language code lengths around size 2",
                  "boundary_values": ["", "f", "fr", "fra"],
                  "important_case": "exactly two characters must exercise the >= 2 branch"
              },
              "source_context": [
                  {"line": n, "is_target": n == target, "content": lines[n - 1]}
                  for n in range(start, end + 1)
              ]
          }

          Path("agent-language-command-line-302-context.json").write_text(
              json.dumps(context, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8"
          )
          PY
          python3 -m json.tool agent-language-command-line-302-context.json

      - name: Install Aider
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user aider-chat
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Record test baseline before Aider
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["TEST_FILE"])
          content = path.read_text(encoding="utf-8", errors="replace")
          count = len(re.findall(r"\bTEST(?:_F|_P)?\s*\(", content))
          Path("baseline-test-count.txt").write_text(f"{count}\n", encoding="utf-8")
          print(f"Existing GoogleTest declaration count: {count}")
          PY

      - name: Analyze and enrich existing language command test with Aider
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          PROMPT=$(cat <<'EOF'
          Analyse les mutants Mull survivants decrits dans agent-language-command-line-302-context.json.

          Objectif : tuer uniquement les mutants de la ligne 302 de
          isobus/src/isobus_language_command_interface.cpp :
          - cxx_ge_to_gt sur languageCode.size() >= 2 ;
          - cxx_ge_to_lt sur languageCode.size() >= 2.

          Ces mutants concernent la logique de parsing ou de reception du language code.
          Le cas important est la longueur exactement egale a 2, car le code original
          doit prendre la branche >= 2 pour une valeur comme "fr" ou "en".

          Analyse toi-meme le code de production autour de la ligne 302 et le test existant
          le plus approprie, probablement LanguageCommandInterfaceTest.MessageContentParsing.
          Ajoute des verifications minimales et deterministes qui passent sur le code original
          et echouent si la condition languageCode.size() >= 2 devient > ou <.

          Contraintes absolues :
          - modifie uniquement le fichier de test fourni en edition ;
          - enrichis uniquement un test existant de LanguageCommandInterfaceTest ;
          - ne cree aucun nouveau TEST, TEST_F ou TEST_P ;
          - ne modifie jamais le code de production ;
          - ne modifie aucun autre fichier ;
          - n'affaiblis, ne supprime et ne remplace aucune assertion existante ;
          - n'utilise aucune attente reelle ;
          - n'ajoute aucune dependance GoogleMock ;
          - utilise uniquement les API publiques et les assertions GoogleTest deja disponibles ;
          - applique la modification minimale necessaire.

          Indices autorises :
          - privilegie un scenario de parsing ou de reception de message qui permet de verifier
            get_language_code() apres traitement d'une trame contenant exactement deux caracteres ;
          - ajoute aussi un cas voisin de longueur 1 ou 3 uniquement si cela aide a rendre la
            difference observable ;
          - ne reutilise pas la strategie invalide des getters apres setters si elle ne passe pas
            par le parsing concerne par la ligne 302.

          Le fichier de production et le contexte du mutant sont fournis en lecture seule.
          Le fichier de test est fourni en edition. Genere et applique toi-meme le patch uniquement dans ce fichier.
          EOF
          )

          aider \
            --model openrouter/nvidia/nemotron-3-ultra-550b-a55b:free \
            --edit-format diff \
            --read agent-language-command-line-302-context.json \
            --read "${SOURCE_FILE}" \
            --file "${TEST_FILE}" \
            --message "${PROMPT}" \
            --no-gitignore \
            --map-tokens 0 \
            --no-check-update \
            --no-show-release-notes \
            --analytics-disable \
            --chat-history-file "${RUNNER_TEMP}/aider.chat.history.md" \
            --input-history-file "${RUNNER_TEMP}/aider.input.history" \
            --llm-history-file "${RUNNER_TEMP}/aider.llm.history" \
            --no-auto-commits \
            --no-dirty-commits \
            --no-pretty \
            --no-stream \
            --yes-always \
            2>&1 | tee aider-language-command-line-302-edit.txt

          test -s aider-language-command-line-302-edit.txt

      - name: Enforce Aider modification boundaries
        shell: bash
        run: |
          set -euo pipefail

          changed_files=$(git diff --name-only)
          if [ -z "${changed_files}" ]; then
            echo "Aider did not modify any tracked file." >&2
            exit 1
          fi

          while IFS= read -r changed_file; do
            if [ "${changed_file}" != "${TEST_FILE}" ]; then
              echo "Aider modified a tracked file other than ${TEST_FILE}: ${changed_file}" >&2
              git diff -- "${changed_file}" >&2
              exit 1
            fi
          done <<< "${changed_files}"

          if ! git diff --quiet -- "${SOURCE_FILE}"; then
            echo "Production code was modified." >&2
            exit 1
          fi

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["TEST_FILE"])
          content = path.read_text(encoding="utf-8", errors="replace")
          before = int(Path("baseline-test-count.txt").read_text().strip())
          after = len(re.findall(r"\bTEST(?:_F|_P)?\s*\(", content))
          if after != before:
              raise SystemExit(f"GoogleTest declaration count changed: before={before}, after={after}")
          if "LanguageCommandInterfaceTest" not in content:
              raise SystemExit("LanguageCommandInterfaceTest was not found in the modified test file.")
          print(f"GoogleTest declaration count unchanged: {after}")
          PY

          git diff --check
          git diff -- "${TEST_FILE}" | tee aider-language-command-line-302.patch

      - name: Rebuild unit tests after Aider edit
        shell: bash
        run: |
          set -euo pipefail
          find build -type f -name '*.gcda' -delete
          cmake --build build --parallel
          test -x "${TEST_EXECUTABLE}"

      - name: Run enriched language command tests
        shell: bash
        run: |
          set -euo pipefail
          cd build/test
          ./unit_tests --gtest_filter="${TEST_FILTER}" --gtest_color=no 2>&1 | tee "${GITHUB_WORKSPACE}/language-command-tests-after-aider.log"

      - name: Run Mull campaign after Aider edit
        shell: bash
        env:
          MULL_CONFIG: ${{ github.workspace }}/mull-config.yml
        run: |
          set -euo pipefail
          rm -rf mull-results-after-aider
          mkdir -p mull-results-after-aider
          cd build/test
          mull-runner-19 \
            --allow-surviving \
            --ide-reporter-show-killed \
            --debug \
            --timeout 120000 \
            --reporters IDE \
            --reporters Elements \
            --report-dir "${GITHUB_WORKSPACE}/mull-results-after-aider" \
            --report-name language-command-after-aider-line-302 \
            ./unit_tests \
            --gtest_filter="${TEST_FILTER}" \
            --gtest_color=no \
            2>&1 | tee "${GITHUB_WORKSPACE}/mull-results-after-aider/mull-console.log"

      - name: Verify line 302 target mutants and report remaining survivors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          source = os.environ["SOURCE_FILE"].replace("\\", "/")
          target_line = int(os.environ["TARGET_LINE"])
          target_operators = set(os.environ["TARGET_OPERATORS"].split())
          log = Path("mull-results-after-aider/mull-console.log").read_text(
              encoding="utf-8", errors="replace"
          )
          pattern = re.compile(
              r"(?:^|\s)(cxx_[A-Za-z0-9_]+):"
              r"(.+?):(\d+):(\d+):\d+:\d+\s+->\s+(Passed|Failed)"
          )
          rows = []
          for operator, path, line, column, status in pattern.findall(log):
              normalized = path.replace("\\", "/")
              if normalized.endswith(source):
                  rows.append((operator, int(line), int(column), status))

          target_survivors = [
              row for row in rows
              if row[1] == target_line and row[0] in target_operators and row[3] == "Passed"
          ]
          if target_survivors:
              raise SystemExit(f"Line 302 target mutants still survive: {target_survivors}")

          surviving = sorted(row for row in rows if row[3] == "Passed")
          report = [
              "Line 302 target mutants: killed.",
              f"Target operators: {sorted(target_operators)}",
              f"All surviving mutants after Aider: {len(surviving)}",
          ]
          report.extend(str(row) for row in surviving)
          Path("post-aider-mutation-summary.txt").write_text(
              "\n".join(report) + "\n", encoding="utf-8"
          )
          print("\n".join(report))
          PY

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Language command line 302 mutants"
            echo
            echo '```text'
            cat post-aider-mutation-summary.txt 2>/dev/null || echo "Final mutation summary was not generated."
            echo '```'
            echo
            echo "## Authorized patch"
            echo
            echo '```diff'
            cat aider-language-command-line-302.patch 2>/dev/null || echo "Aider patch was not generated."
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mull-language-command-line-302-edit-and-validation-v1
          path: |
            mull-config.yml
            language-command-tests-before-aider.log
            mull-results-before-aider/
            agent-language-command-line-302-context.json
            baseline-test-count.txt
            aider-language-command-line-302-edit.txt
            aider-language-command-line-302.patch
            language-command-tests-after-aider.log
            mull-results-after-aider/
            post-aider-mutation-summary.txt
          if-no-files-found: warn
          retention-days: 30
