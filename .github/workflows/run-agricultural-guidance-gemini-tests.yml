name: Run AgriculturalGuidanceInterface Gemini tests

on:
  workflow_dispatch:

  push:
    branches:
      - research/agricultural-guidance-plus-gemini
    paths:
      - ".github/workflows/run-agricultural-guidance-gemini-tests.yml"

permissions:
  contents: read


jobs:
  run-generated-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential

      - name: Prepare evidence directory
        run: mkdir -p agricultural-guidance-gemini-run-evidence

      - name: Configure project
        run: |
          set -o pipefail
          cmake -S . \
            -B build-agricultural-guidance-gemini-tests \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            2>&1 | tee agricultural-guidance-gemini-run-evidence/configure.log

      - name: Build unit tests
        run: |
          set -o pipefail
          cmake --build build-agricultural-guidance-gemini-tests \
            --target unit_tests \
            --parallel 2 \
            2>&1 | tee agricultural-guidance-gemini-run-evidence/build.log

      - name: Locate unit test executable
        id: locate-tests
        shell: bash
        run: |
          set -euo pipefail

          TEST_BINARY=""
          for candidate in \
            build-agricultural-guidance-gemini-tests/test/unit_tests \
            build-agricultural-guidance-gemini-tests/unit_tests
          do
            if [[ -x "${candidate}" ]]; then
              TEST_BINARY="${candidate}"
              break
            fi
          done

          if [[ -z "${TEST_BINARY}" ]]; then
            TEST_BINARY="$(find build-agricultural-guidance-gemini-tests -type f -name unit_tests -perm -111 | head -n 1)"
          fi

          if [[ -z "${TEST_BINARY}" || ! -x "${TEST_BINARY}" ]]; then
            echo "ERROR: unit_tests executable not found." | tee agricultural-guidance-gemini-run-evidence/locate-error.txt
            exit 1
          fi

          echo "binary=${TEST_BINARY}" >> "${GITHUB_OUTPUT}"
          printf '%s\n' "${TEST_BINARY}" | tee agricultural-guidance-gemini-run-evidence/test-binary-path.txt

      - name: List generated Gemini tests
        shell: bash
        run: |
          set -o pipefail

          TEST_BINARY="${{ steps.locate-tests.outputs.binary }}"

          "${TEST_BINARY}" --gtest_list_tests --gtest_color=no \
            2>&1 | tee agricultural-guidance-gemini-run-evidence/gtest-list-tests.txt

          MATCH_COUNT="$("${TEST_BINARY}" \
            --gtest_list_tests \
            --gtest_filter='AgriculturalGuidanceInterfaceTest.*:AgriculturalGuidanceTest.*' \
            --gtest_color=no \
            2>/dev/null \
            | awk '/^  [^ ]/ { count++ } END { print count+0 }')"

          printf '%s\n' "${MATCH_COUNT}" | tee agricultural-guidance-gemini-run-evidence/matched-test-count.txt

          if [[ "${MATCH_COUNT}" -eq 0 ]]; then
            echo "ERROR: no Gemini test matched the expected AgriculturalGuidance fixtures." \
              | tee agricultural-guidance-gemini-run-evidence/no-matching-tests.txt
            exit 1
          fi

      - name: Run generated Gemini tests
        shell: bash
        run: |
          set -o pipefail

          TEST_BINARY="${{ steps.locate-tests.outputs.binary }}"
          FILTER='AgriculturalGuidanceInterfaceTest.*:AgriculturalGuidanceTest.*'

          set +e
          "${TEST_BINARY}" \
            --gtest_filter="${FILTER}" \
            --gtest_color=no \
            --gtest_output=xml:agricultural-guidance-gemini-run-evidence/gtest-results.xml \
            2>&1 | tee agricultural-guidance-gemini-run-evidence/gtest-run.log
          TEST_EXIT_STATUS=${PIPESTATUS[0]}
          set -e

          {
            echo "Gemini AgriculturalGuidanceInterface generated tests run summary"
            echo
            echo "Commit: ${GITHUB_SHA}"
            echo "Filter: ${FILTER}"
            echo "Test exit status: ${TEST_EXIT_STATUS}"
          } | tee agricultural-guidance-gemini-run-evidence/run-summary.txt

          exit "${TEST_EXIT_STATUS}"

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agricultural-guidance-gemini-run-evidence
          path: agricultural-guidance-gemini-run-evidence/
          if-no-files-found: warn
          retention-days: 30
