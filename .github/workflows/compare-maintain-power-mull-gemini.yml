name: Compare Mull on MaintainPower baseline and Gemini tests

on:
  push:
    branches:
      - research/maintain-power-plus-gemini
    paths:
      - ".github/workflows/compare-maintain-power-mull-gemini.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_FILE: isobus/src/isobus_maintain_power_interface.cpp
  GENERATED_TEST_FILE: test/generated_maintain_power_tests.cpp

jobs:
  compare-mull:
    name: Compare Mull baseline and generated tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Clang 19 Mull and build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            clang-19 \
            llvm-19 \
            build-essential \
            cmake \
            ninja-build \
            curl

          curl -1sLf \
            "https://dl.cloudsmith.io/public/mull-project/mull-stable/setup.deb.sh" \
            | sudo -E bash

          sudo apt-get update
          sudo apt-get install -y mull-19

      - name: Verify tools and files
        shell: bash
        run: |
          set -euo pipefail

          clang-19 --version
          llvm-profdata-19 --version
          llvm-cov-19 --version
          mull-runner-19 --version

          test -f /usr/lib/mull-ir-frontend-19
          test -f "${SOURCE_FILE}"
          test -f "${GENERATED_TEST_FILE}"

      - name: Create Mull configuration
        shell: bash
        run: |
          set -euo pipefail

          ESCAPED_SOURCE_FILE=$(printf '%s' "${SOURCE_FILE}" | sed 's#[][\\.^$*+?(){}|]#\\&#g')

          cat > mull.yml <<EOF
          includePaths:
            - '.*${ESCAPED_SOURCE_FILE}$'
          excludePaths:
            - '.*googletest.*'
            - '.*googlemock.*'
            - '.*gtest.*'
            - '.*gmock.*'
          quiet: false
          EOF

          echo "=== Mull configuration ==="
          cat mull.yml

      - name: Save generated tests and create empty baseline source
        shell: bash
        run: |
          set -euo pipefail

          cp "${GENERATED_TEST_FILE}" /tmp/generated_maintain_power_tests.cpp
          : > "${GENERATED_TEST_FILE}"

      - name: Configure baseline build
        shell: bash
        env:
          CC: clang-19
          CXX: clang++-19
          MULL_CONFIG: ${{ github.workspace }}/mull.yml
        run: |
          set -euo pipefail

          cmake -S . -B build-mull-baseline \
            -G Ninja \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_FLAGS="-O0 -g -grecord-command-line -fprofile-instr-generate -fcoverage-mapping -fpass-plugin=/usr/lib/mull-ir-frontend-19" \
            -DCMAKE_CXX_FLAGS="-O0 -g -grecord-command-line -fprofile-instr-generate -fcoverage-mapping -fpass-plugin=/usr/lib/mull-ir-frontend-19" \
            -DCMAKE_EXE_LINKER_FLAGS="-fprofile-instr-generate"

      - name: Build baseline
        shell: bash
        run: |
          set -euo pipefail

          cmake --build build-mull-baseline --parallel 2
          test -x build-mull-baseline/test/unit_tests

      - name: Run baseline tests and create coverage profile
        shell: bash
        working-directory: build-mull-baseline/test
        env:
          LLVM_PROFILE_FILE: ${{ github.workspace }}/baseline.profraw
        run: |
          set -euo pipefail

          rm -f "${GITHUB_WORKSPACE}/baseline.profraw" "${GITHUB_WORKSPACE}/baseline.profdata"

          ./unit_tests \
            --gtest_color=no \
            2>&1 | tee "${GITHUB_WORKSPACE}/baseline-tests.log"

          test -s "${GITHUB_WORKSPACE}/baseline.profraw"

          llvm-profdata-19 merge \
            -sparse \
            "${GITHUB_WORKSPACE}/baseline.profraw" \
            -o "${GITHUB_WORKSPACE}/baseline.profdata"

          test -s "${GITHUB_WORKSPACE}/baseline.profdata"

      - name: Run Mull baseline
        shell: bash
        working-directory: build-mull-baseline/test
        env:
          MULL_CONFIG: ${{ github.workspace }}/mull.yml
        run: |
          set -euo pipefail

          mkdir -p "${GITHUB_WORKSPACE}/mull-results-baseline"

          mull-runner-19 \
            --allow-surviving \
            --debug \
            --timeout 120000 \
            --coverage-info "${GITHUB_WORKSPACE}/baseline.profdata" \
            --reporters IDE \
            --reporters Elements \
            --report-dir "${GITHUB_WORKSPACE}/mull-results-baseline" \
            --report-name maintain-power-baseline \
            ./unit_tests \
            --gtest_color=no \
            2>&1 | tee "${GITHUB_WORKSPACE}/mull-results-baseline/mull-console.log"

      - name: Restore generated tests
        shell: bash
        run: |
          set -euo pipefail

          cp /tmp/generated_maintain_power_tests.cpp "${GENERATED_TEST_FILE}"

      - name: Configure generated tests build
        shell: bash
        env:
          CC: clang-19
          CXX: clang++-19
          MULL_CONFIG: ${{ github.workspace }}/mull.yml
        run: |
          set -euo pipefail

          cmake -S . -B build-mull-generated \
            -G Ninja \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_FLAGS="-O0 -g -grecord-command-line -fprofile-instr-generate -fcoverage-mapping -fpass-plugin=/usr/lib/mull-ir-frontend-19" \
            -DCMAKE_CXX_FLAGS="-O0 -g -grecord-command-line -fprofile-instr-generate -fcoverage-mapping -fpass-plugin=/usr/lib/mull-ir-frontend-19" \
            -DCMAKE_EXE_LINKER_FLAGS="-fprofile-instr-generate"

      - name: Build with generated tests
        shell: bash
        run: |
          set -euo pipefail

          cmake --build build-mull-generated --parallel 2
          test -x build-mull-generated/test/unit_tests

      - name: Run tests with generated tests and create coverage profile
        shell: bash
        working-directory: build-mull-generated/test
        env:
          LLVM_PROFILE_FILE: ${{ github.workspace }}/generated.profraw
        run: |
          set -euo pipefail

          rm -f "${GITHUB_WORKSPACE}/generated.profraw" "${GITHUB_WORKSPACE}/generated.profdata"

          ./unit_tests \
            --gtest_color=no \
            2>&1 | tee "${GITHUB_WORKSPACE}/generated-tests.log"

          test -s "${GITHUB_WORKSPACE}/generated.profraw"

          llvm-profdata-19 merge \
            -sparse \
            "${GITHUB_WORKSPACE}/generated.profraw" \
            -o "${GITHUB_WORKSPACE}/generated.profdata"

          test -s "${GITHUB_WORKSPACE}/generated.profdata"

      - name: Run Mull with generated tests
        shell: bash
        working-directory: build-mull-generated/test
        env:
          MULL_CONFIG: ${{ github.workspace }}/mull.yml
        run: |
          set -euo pipefail

          mkdir -p "${GITHUB_WORKSPACE}/mull-results-generated"

          mull-runner-19 \
            --allow-surviving \
            --debug \
            --timeout 120000 \
            --coverage-info "${GITHUB_WORKSPACE}/generated.profdata" \
            --reporters IDE \
            --reporters Elements \
            --report-dir "${GITHUB_WORKSPACE}/mull-results-generated" \
            --report-name maintain-power-generated \
            ./unit_tests \
            --gtest_color=no \
            2>&1 | tee "${GITHUB_WORKSPACE}/mull-results-generated/mull-console.log"

      - name: Compare all MaintainPower mutants
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import csv
          import os
          import re
          from collections import Counter
          from pathlib import Path

          source_file = os.environ["SOURCE_FILE"].replace("\\", "/")
          pattern = re.compile(
              r"^(.*?):(\d+):(\d+):\s+"
              r"(?:warning|remark|note|info):\s+"
              r"(Killed|Survived|Timeout|Timedout):\s+"
              r"(.*?)\s+\[([^\]]+)\]\s*$",
              re.IGNORECASE,
          )

          def normalize_status(status):
              value = status.lower()
              if value == "killed":
                  return "Killed"
              if value == "survived":
                  return "Survived"
              return "Timeout"

          def parse_log(path):
              mutants = {}
              text = Path(path).read_text(encoding="utf-8", errors="replace")
              for raw_line in text.splitlines():
                  match = pattern.match(raw_line.strip())
                  if not match:
                      continue
                  path_value, line, column, status, description, operator = match.groups()
                  normalized_path = path_value.replace("\\", "/")
                  if not normalized_path.endswith(source_file):
                      continue
                  key = (
                      int(line),
                      int(column),
                      operator.strip(),
                      description.strip(),
                  )
                  mutants[key] = normalize_status(status)
              return mutants

          baseline = parse_log("mull-results-baseline/mull-console.log")
          generated = parse_log("mull-results-generated/mull-console.log")
          all_keys = sorted(set(baseline) | set(generated))

          rows = []
          for key in all_keys:
              line, column, operator, description = key
              baseline_status = baseline.get(key, "Not reported")
              generated_status = generated.get(key, "Not reported")
              rows.append({
                  "line": line,
                  "column": column,
                  "operator": operator,
                  "description": description,
                  "baseline": baseline_status,
                  "generated": generated_status,
                  "killed_by_generated_tests": (
                      "yes"
                      if baseline_status == "Survived" and generated_status == "Killed"
                      else "no"
                  ),
              })

          with Path("maintain-power-mutants-comparison.csv").open(
              "w", newline="", encoding="utf-8"
          ) as output_file:
              writer = csv.DictWriter(output_file, fieldnames=[
                  "line", "column", "operator", "description",
                  "baseline", "generated", "killed_by_generated_tests",
              ])
              writer.writeheader()
              writer.writerows(rows)

          baseline_counts = Counter(baseline.values())
          generated_counts = Counter(generated.values())
          additional_kills = [
              row for row in rows if row["killed_by_generated_tests"] == "yes"
          ]
          status_changes = [
              row for row in rows if row["baseline"] != row["generated"]
          ]

          def executed(counts):
              return counts["Killed"] + counts["Survived"] + counts["Timeout"]

          def score(counts):
              total = executed(counts)
              return 0.0 if total == 0 else 100.0 * counts["Killed"] / total

          report = [
              "# MaintainPowerInterface Mull comparison",
              "",
              f"Target source: `{source_file}`",
              "",
              "## Baseline: human tests only",
              "",
              f"Mutants reported: {len(baseline)}",
              f"Mutants executed: {executed(baseline_counts)}",
              f"Killed: {baseline_counts['Killed']}",
              f"Survived: {baseline_counts['Survived']}",
              f"Timeout: {baseline_counts['Timeout']}",
              f"Mutation score: {score(baseline_counts):.2f}%",
              "",
              "## Human tests plus corrected Gemini tests",
              "",
              f"Mutants reported: {len(generated)}",
              f"Mutants executed: {executed(generated_counts)}",
              f"Killed: {generated_counts['Killed']}",
              f"Survived: {generated_counts['Survived']}",
              f"Timeout: {generated_counts['Timeout']}",
              f"Mutation score: {score(generated_counts):.2f}%",
              "",
              "## Comparison",
              "",
              f"Additional mutants killed by generated tests: {len(additional_kills)}",
              f"Mutants with a changed status: {len(status_changes)}",
              "",
              "## Status changes",
              "",
          ]

          if status_changes:
              for row in status_changes:
                  report.extend([
                      f"### Line {row['line']}, column {row['column']}",
                      "",
                      f"Operator: `{row['operator']}`",
                      f"Description: {row['description']}",
                      f"Baseline: {row['baseline']}",
                      f"With corrected Gemini tests: {row['generated']}",
                      "",
                  ])
          else:
              report.append("No mutant status changed after adding the corrected Gemini tests.")

          report_text = "\n".join(report) + "\n"
          Path("maintain-power-mull-comparison.md").write_text(
              report_text, encoding="utf-8"
          )
          print(report_text)

          if not baseline or not generated:
              raise SystemExit(
                  "No MaintainPower mutants were parsed from one or both Mull logs."
              )
          PY
      - name: Add result to workflow summary
        if: always()
        shell: bash
        run: |
          if [ -f target-mutants-comparison.md ]; then
            cat target-mutants-comparison.md >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Mull comparison was not generated." >> "${GITHUB_STEP_SUMMARY}"
          fi

          echo >> "${GITHUB_STEP_SUMMARY}"
          echo "## Tests covering target lines" >> "${GITHUB_STEP_SUMMARY}"
          echo >> "${GITHUB_STEP_SUMMARY}"
          echo '```text' >> "${GITHUB_STEP_SUMMARY}"
          cat tests-covering-target-lines.txt 2>/dev/null \
            >> "${GITHUB_STEP_SUMMARY}" \
            || echo "Coverage report was not generated." \
            >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload comparison artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintain-power-mull-gemini-comparison
          if-no-files-found: warn
          retention-days: 30
          path: |
            mull.yml
            baseline-tests.log
            generated-tests.log
            baseline.profdata
            generated.profdata
            mull-results-baseline/
            mull-results-generated/
            maintain-power-mull-comparison.md
            maintain-power-mutants-comparison.csv
