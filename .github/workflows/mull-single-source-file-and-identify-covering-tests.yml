name: Mull - Single Source File - All Tests and Covering Tests

on:
  workflow_dispatch:
    inputs:
      source_file:
        description: "Chemin du fichier source a muter"
        required: true
        type: string

  push:
    branches:
      - quality/mull-can-NAME-filter
    paths:
      - .github/workflows/mull-single-source-file-and-identify-covering-tests.yml

permissions:
  contents: read

env:
  SOURCE_FILE: ${{ inputs.source_file || 'isobus/src/can_NAME_filter.cpp' }}
  TEST_EXECUTABLE: build/test/unit_tests

jobs:
  mutation-testing:
    name: Mutation testing and covering tests - single source file
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Clang 19 Mull and build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            clang-19 \
            llvm-19 \
            build-essential \
            cmake \
            ninja-build \
            curl

          curl -1sLf \
            "https://dl.cloudsmith.io/public/mull-project/mull-stable/setup.deb.sh" \
            | sudo -E bash

          sudo apt-get update
          sudo apt-get install -y mull-19

      - name: Verify tools and source file
        shell: bash
        run: |
          set -euo pipefail

          clang-19 --version
          llvm-profdata-19 --version
          llvm-cov-19 --version
          mull-runner-19 --version
          test -f /usr/lib/mull-ir-frontend-19
          test -f "${SOURCE_FILE}"

      - name: Create Mull configuration
        shell: bash
        run: |
          set -euo pipefail

          ESCAPED_SOURCE_FILE=$(printf '%s' "${SOURCE_FILE}" | sed 's#[][\\.^$*+?(){}|]#\\&#g')

          cat > mull-config.yml <<EOF
          includePaths:
            - '.*can_NAME_filter\.cpp$'
          excludePaths:
            - '.*googletest.*'
            - '.*googlemock.*'
            - '.*gtest.*'
            - '.*gmock.*'
          quiet: false
          EOF

          echo "=== Mull configuration ==="
          cat mull-config.yml

      - name: Configure tests for Mull and LLVM coverage
        shell: bash
        env:
          CC: clang-19
          CXX: clang++-19
          MULL_CONFIG: ${{ github.workspace }}/mull-config.yml
        run: |
          set -euo pipefail

          cmake -S . -B build \
            -G Ninja \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_FLAGS="-O0 -g -grecord-command-line -fprofile-instr-generate -fcoverage-mapping -fpass-plugin=/usr/lib/mull-ir-frontend-19" \
            -DCMAKE_CXX_FLAGS="-O0 -g -grecord-command-line -fprofile-instr-generate -fcoverage-mapping -fpass-plugin=/usr/lib/mull-ir-frontend-19" \
            -DCMAKE_EXE_LINKER_FLAGS="-fprofile-instr-generate"

      - name: Compile unit tests
        shell: bash
        env:
          MULL_CONFIG: ${{ github.workspace }}/mull-config.yml
        run: |
          set -euo pipefail

          cmake --build build --parallel
          test -x "${TEST_EXECUTABLE}"

      - name: Run all unit tests and generate coverage
        shell: bash
        env:
          LLVM_PROFILE_FILE: ${{ github.workspace }}/all-tests.profraw
        run: |
          set -euo pipefail

          rm -f all-tests.profraw all-tests.profdata

          cd build/test
          
          ./unit_tests \
            --gtest_color=no \
            2>&1 | tee "${GITHUB_WORKSPACE}/all-tests-baseline.log"

          cd "${GITHUB_WORKSPACE}"
          
          test -s all-tests.profraw

          llvm-profdata-19 merge \
            -sparse \
            all-tests.profraw \
            -o all-tests.profdata

          test -s all-tests.profdata

      - name: Generate readable coverage report
        shell: bash
        run: |
          set -euo pipefail

          llvm-cov-19 show \
            "${TEST_EXECUTABLE}" \
            -instr-profile=all-tests.profdata \
            "${SOURCE_FILE}" \
            | tee source-file-coverage.txt

      - name: Run Mull with all unit tests
        shell: bash
        env:
          MULL_CONFIG: ${{ github.workspace }}/mull-config.yml
        run: |
          set -euo pipefail

          mkdir -p "${GITHUB_WORKSPACE}/mull-results"

          cd build/test
          
          mull-runner-19 \
            --allow-surviving \
            --debug \
            --timeout 120000 \
            --coverage-info "${GITHUB_WORKSPACE}/all-tests.profdata" \
            --reporters IDE \
            --reporters Elements \
            --report-dir "${GITHUB_WORKSPACE}/mull-results" \
            --report-name single-source-file-all-tests \
            ./unit_tests \
            --gtest_color=no \
            2>&1 | tee "${GITHUB_WORKSPACE}/mull-results/mull-console.log"

      - name: Extract surviving mutants
        id: surviving-mutants
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          source_file = os.environ["SOURCE_FILE"].replace("\\", "/")
          log_file = Path("mull-results/mull-console.log")
          output_file = Path("surviving-mutants.tsv")

          pattern = re.compile(
              r"\[\d+/\d+\]\s+"
              r"([^:]+):"
              r"(.+?):"
              r"(\d+):(\d+):\d+:\d+\s+->\s+Passed"
          )

          rows = []

          for raw_line in log_file.read_text(
              encoding="utf-8", errors="replace"
          ).splitlines():
              match = pattern.search(raw_line)

              if not match:
                  continue

              operator, path, line, column = match.groups()

              if path.replace("\\", "/").endswith(source_file):
                  rows.append(
                      (line, column, f"Survived mutation {operator}", operator)
                  )

          rows = list(dict.fromkeys(rows))

          with output_file.open("w", encoding="utf-8") as output:
              for row in rows:
                  output.write("\t".join(row) + "\n")

          with Path(os.environ["GITHUB_OUTPUT"]).open(
              "a", encoding="utf-8"
          ) as output:
              output.write(f"count={len(rows)}\n")
          PY

          echo "=== Surviving mutants ==="
          cat surviving-mutants.tsv
          
      - name: List unit tests
        if: steps.surviving-mutants.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail

          cd build/test

          ./unit_tests \
            --gtest_list_tests \
            --gtest_color=no \
            > "${GITHUB_WORKSPACE}/gtest-list.txt"

          awk '
            /^[^[:space:]]/ {
              suite = $1
              sub(/\.$/, "", suite)
              next
            }
            /^[[:space:]]+/ {
              test = $1
              sub(/#.*/, "", test)
              if (suite != "" && test != "") {
                print suite "." test
              }
            }
          ' "${GITHUB_WORKSPACE}/gtest-list.txt" \
            > "${GITHUB_WORKSPACE}/selected-tests.txt"

          test -s "${GITHUB_WORKSPACE}/selected-tests.txt"

      - name: Identify tests covering surviving mutants
        if: steps.surviving-mutants.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_FILE_ABS="${GITHUB_WORKSPACE}/${SOURCE_FILE}"
          TEST_EXECUTABLE_ABS="${GITHUB_WORKSPACE}/${TEST_EXECUTABLE}"
          RESULTS_DIR="${GITHUB_WORKSPACE}/per-test-coverage"
          REPORT_FILE="${GITHUB_WORKSPACE}/tests-covering-surviving-mutants.txt"
          FAILED_FILE="${GITHUB_WORKSPACE}/tests-not-analysed.txt"

          mkdir -p "${RESULTS_DIR}"
          : > "${FAILED_FILE}"

          TARGET_LINES=$(cut -f1 surviving-mutants.tsv | sort -n -u | tr '\n' ' ')
          for line in ${TARGET_LINES}; do
            : > "${RESULTS_DIR}/line-${line}-tests.txt"
          done

          index=0
          while IFS= read -r test_name; do
            index=$((index + 1))
            profile_raw="${RESULTS_DIR}/test-${index}.profraw"
            profile_data="${RESULTS_DIR}/test-${index}.profdata"
            coverage_text="${RESULTS_DIR}/test-${index}.txt"

            echo "[${index}] ${test_name}"

            if ! (
              cd "${GITHUB_WORKSPACE}/build/test"

              LLVM_PROFILE_FILE="${profile_raw}" \
                ./unit_tests \
                  --gtest_filter="${test_name}" \
                  --gtest_color=no \
                  > /dev/null 2>&1
              ); then
              echo "${test_name}" >> "${FAILED_FILE}"
              rm -f "${profile_raw}" "${profile_data}" "${coverage_text}"
              continue
            fi

            if [ ! -s "${profile_raw}" ]; then
              echo "${test_name}" >> "${FAILED_FILE}"
              rm -f "${profile_raw}" "${profile_data}" "${coverage_text}"
              continue
            fi

            llvm-profdata-19 merge -sparse "${profile_raw}" -o "${profile_data}"

            llvm-cov-19 show \
              "${TEST_EXECUTABLE_ABS}" \
              -instr-profile="${profile_data}" \
              "${SOURCE_FILE_ABS}" \
              > "${coverage_text}"

            for target_line in ${TARGET_LINES}; do
              if awk -F'|' -v target_line="${target_line}" '
                {
                  line = $1
                  count = $2
                  gsub(/[[:space:]]/, "", line)
                  gsub(/[[:space:]]/, "", count)
                  if (line == target_line && count != "" && count != "0") {
                    found = 1
                  }
                }
                END { exit(found ? 0 : 1) }
              ' "${coverage_text}"; then
                echo "${test_name}" >> "${RESULTS_DIR}/line-${target_line}-tests.txt"
              fi
            done

            rm -f "${profile_raw}" "${profile_data}" "${coverage_text}"
          done < "${GITHUB_WORKSPACE}/selected-tests.txt"

          for line in ${TARGET_LINES}; do
            sort -u "${RESULTS_DIR}/line-${line}-tests.txt" \
              -o "${RESULTS_DIR}/line-${line}-tests.txt"
          done

          {
            echo "Surviving mutants in ${SOURCE_FILE}"
            echo
            while IFS=$'\t' read -r line column description operator; do
              echo "Line ${line}, column ${column}"
              echo "Mutant: ${description} [${operator}]"
              echo "Tests covering line ${line}:"
              if [ -s "${RESULTS_DIR}/line-${line}-tests.txt" ]; then
                cat "${RESULTS_DIR}/line-${line}-tests.txt"
              else
                echo "No individual test found"
              fi
              echo
            done < surviving-mutants.tsv

            echo "Tests not analysed successfully"
            if [ -s "${FAILED_FILE}" ]; then
              cat "${FAILED_FILE}"
            else
              echo "None"
            fi
          } | tee "${REPORT_FILE}"

      - name: Report no surviving mutants
        if: steps.surviving-mutants.outputs.count == '0'
        shell: bash
        run: |
          echo "No surviving mutant found for ${SOURCE_FILE}." \
            | tee tests-covering-surviving-mutants.txt

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Mull and covering tests"
            echo
            echo '```text'
            cat tests-covering-surviving-mutants.txt 2>/dev/null || \
              echo "The covering-tests report was not generated."
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mull-single-source-file-and-covering-tests
          path: |
            mull-results/
            mull-config.yml
            all-tests-baseline.log
            all-tests.profdata
            source-file-coverage.txt
            surviving-mutants.tsv
            tests-covering-surviving-mutants.txt
            tests-not-analysed.txt
            selected-tests.txt
            gtest-list.txt
            per-test-coverage/line-*-tests.txt
          if-no-files-found: warn
          retention-days: 30
