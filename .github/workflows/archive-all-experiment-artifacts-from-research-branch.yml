name: Archive experiment artifacts from research branches

on:
  workflow_dispatch:
  push:
    branches:
      - research/ai-generated-cpp-tests
    paths:
      - ".github/workflows/archive-all-experiment-artifacts-from-research-branch.yml"

permissions:
  actions: read
  contents: write

concurrency:
  group: archive-experiment-artifacts
  cancel-in-progress: false

jobs:
  archive:
    name: Download artifacts and publish a GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      ARCHIVE_DIR: experiment-artifacts-archive

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare archive directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${ARCHIVE_DIR}/artifacts"

      - name: List and download all non-expired experiment artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          MANIFEST="${ARCHIVE_DIR}/manifest.tsv"
          printf 'artifact_id\tartifact_name\tbranch\tworkflow_run_id\tcreated_at\texpires_at\tsize_bytes\tfile\n' > "${MANIFEST}"

          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | select(
              .workflow_run.head_branch == "research/ai-generated-cpp-tests" or
              .workflow_run.head_branch == "research/maintain-power-plus-gemini" or
              .workflow_run.head_branch == "research/maintain-power-plus-unittestbot" or
              .workflow_run.head_branch == "research/agricultural-guidance-plus-gpt56" or
              .workflow_run.head_branch == "research/agricultural-guidance-plus-gemini" or
              .workflow_run.head_branch == "research/agricultural-guidance-plus-unittestbot"
            ) | [.id, .name, .workflow_run.head_branch, .workflow_run.id, .created_at, .expires_at, .size_in_bytes, .archive_download_url] | @tsv' \
            > "${ARCHIVE_DIR}/artifacts-to-download.tsv"

          if [ ! -s "${ARCHIVE_DIR}/artifacts-to-download.tsv" ]; then
            echo "ERROR: no non-expired artifact was found for the six experiment branches."
            exit 1
          fi

          while IFS=$'\t' read -r ID NAME BRANCH RUN_ID CREATED EXPIRES SIZE URL; do
            SAFE_NAME=$(printf '%s' "${NAME}" | tr -cs 'A-Za-z0-9._-' '_')
            SAFE_BRANCH=$(printf '%s' "${BRANCH}" | tr -cs 'A-Za-z0-9._-' '_')
            FILE="${SAFE_BRANCH}__run-${RUN_ID}__artifact-${ID}__${SAFE_NAME}.zip"

            echo "Downloading artifact ${ID}: ${NAME} (${BRANCH}, run ${RUN_ID})"
            gh api "${URL}" > "${ARCHIVE_DIR}/artifacts/${FILE}"
            test -s "${ARCHIVE_DIR}/artifacts/${FILE}"

            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "${ID}" "${NAME}" "${BRANCH}" "${RUN_ID}" \
              "${CREATED}" "${EXPIRES}" "${SIZE}" "${FILE}" \
              >> "${MANIFEST}"
          done < "${ARCHIVE_DIR}/artifacts-to-download.tsv"

          ARTIFACT_COUNT=$(find "${ARCHIVE_DIR}/artifacts" -type f -name '*.zip' | wc -l)
          echo "Downloaded artifacts: ${ARTIFACT_COUNT}"
          echo "artifact_count=${ARTIFACT_COUNT}" >> "${GITHUB_ENV}"

      - name: Generate checksums and archive
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "${ARCHIVE_DIR}"
            sha256sum artifacts/*.zip > SHA256SUMS.txt
          )

          ARCHIVE_DATE=$(date -u +'%Y-%m-%dT%H-%M-%SZ')
          ARCHIVE_FILE="experiment-artifacts-${ARCHIVE_DATE}.tar.gz"
          tar -czf "${ARCHIVE_FILE}" "${ARCHIVE_DIR}"
          sha256sum "${ARCHIVE_FILE}" > "${ARCHIVE_FILE}.sha256"

          echo "archive_date=${ARCHIVE_DATE}" >> "${GITHUB_ENV}"
          echo "archive_file=${ARCHIVE_FILE}" >> "${GITHUB_ENV}"

      - name: Publish durable GitHub Release archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="experiment-artifacts-${archive_date}"
          TITLE="Experiment artifacts archive ${archive_date}"

          cat > release-notes.md <<EOF
          Archive of ${artifact_count} non-expired workflow artifacts collected from the six experimental branches.

          The archive preserves each original artifact as a ZIP file and includes:
          - manifest.tsv
          - SHA256SUMS.txt
          - branch, workflow-run and artifact identifiers in every filename

          Created from repository ${GITHUB_REPOSITORY} at commit ${GITHUB_SHA}.
          EOF

          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            "${archive_file}" \
            "${archive_file}.sha256" \
            --title "${TITLE}" \
            --notes-file release-notes.md

          echo "Release created: ${TAG}"
