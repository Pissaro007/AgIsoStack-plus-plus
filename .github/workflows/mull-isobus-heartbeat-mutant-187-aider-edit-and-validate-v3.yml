name: Mull - Edit and Validate Heartbeat Mutant Line 187 with Aider v3

on:
  workflow_dispatch:
    inputs:
      source_file:
        description: "Chemin du fichier source a muter"
        required: true
        default: "isobus/src/isobus_heartbeat.cpp"
        type: string

  push:
    branches:
      - quality/generic-mull-workflows
    paths:
      - .github/workflows/mull-isobus-heartbeat-mutant-187-aider-edit-and-validate-v3.yml

permissions:
  contents: read

env:
  SOURCE_FILE: ${{ inputs.source_file || 'isobus/src/isobus_heartbeat.cpp' }}
  TEST_FILE: test/heartbeat_tests.cpp
  TEST_EXECUTABLE: build/test/unit_tests
  TARGET_LINE: "187"
  TARGET_OPERATOR: cxx_ne_to_eq

jobs:
  mutation-testing:
    name: Enrich existing test and validate mutant line 187
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Clang 19 Mull and build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang-19 llvm-19 build-essential cmake ninja-build curl python3-pip
          curl -1sLf "https://dl.cloudsmith.io/public/mull-project/mull-stable/setup.deb.sh" | sudo -E bash
          sudo apt-get update
          sudo apt-get install -y mull-19

      - name: Verify tools and input files
        shell: bash
        run: |
          set -euo pipefail
          clang-19 --version
          llvm-profdata-19 --version
          llvm-cov-19 --version
          mull-runner-19 --version
          test -f /usr/lib/mull-ir-frontend-19
          test -f "${SOURCE_FILE}"
          test -f "${TEST_FILE}"

      - name: Create Mull configuration
        shell: bash
        run: |
          set -euo pipefail
          ESCAPED_SOURCE_FILE=$(printf '%s' "${SOURCE_FILE}" | sed 's#[][\\.^$*+?(){}|]#\\&#g')
          cat > mull-config.yml <<EOF
          includePaths:
            - '.*${ESCAPED_SOURCE_FILE}$'
          excludePaths:
            - '.*googletest.*'
            - '.*googlemock.*'
            - '.*gtest.*'
            - '.*gmock.*'
          quiet: false
          EOF
          cat mull-config.yml

      - name: Configure tests for Mull and LLVM coverage
        shell: bash
        env:
          CC: clang-19
          CXX: clang++-19
          MULL_CONFIG: ${{ github.workspace }}/mull-config.yml
        run: |
          set -euo pipefail
          cmake -S . -B build \
            -G Ninja \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_FLAGS="-O0 -g -grecord-command-line -fprofile-instr-generate -fcoverage-mapping -fpass-plugin=/usr/lib/mull-ir-frontend-19" \
            -DCMAKE_CXX_FLAGS="-O0 -g -grecord-command-line -fprofile-instr-generate -fcoverage-mapping -fpass-plugin=/usr/lib/mull-ir-frontend-19" \
            -DCMAKE_EXE_LINKER_FLAGS="-fprofile-instr-generate"

      - name: Compile unit tests
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --parallel
          test -x "${TEST_EXECUTABLE}"

      - name: Run baseline unit test suite and generate coverage
        shell: bash
        env:
          LLVM_PROFILE_FILE: ${{ github.workspace }}/all-tests.profraw
        run: |
          set -euo pipefail
          rm -f all-tests.profraw all-tests.profdata
          cd build/test
          ./unit_tests --gtest_color=no 2>&1 | tee "${GITHUB_WORKSPACE}/all-tests-baseline.log"
          cd "${GITHUB_WORKSPACE}"
          test -s all-tests.profraw
          llvm-profdata-19 merge -sparse all-tests.profraw -o all-tests.profdata
          test -s all-tests.profdata

      - name: Run baseline Mull campaign on the whole source file
        shell: bash
        env:
          MULL_CONFIG: ${{ github.workspace }}/mull-config.yml
        run: |
          set -euo pipefail
          rm -rf mull-results-before-aider
          mkdir -p mull-results-before-aider
          cd build/test
          mull-runner-19 \
            --allow-surviving \
            --debug \
            --timeout 120000 \
            --coverage-info "${GITHUB_WORKSPACE}/all-tests.profdata" \
            --reporters IDE \
            --reporters Elements \
            --report-dir "${GITHUB_WORKSPACE}/mull-results-before-aider" \
            --report-name heartbeat-before-aider \
            ./unit_tests \
            --gtest_color=no \
            2>&1 | tee "${GITHUB_WORKSPACE}/mull-results-before-aider/mull-console.log"

      - name: Verify target mutant survives before Aider
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          source = os.environ["SOURCE_FILE"].replace("\\", "/")
          line = os.environ["TARGET_LINE"]
          operator = os.environ["TARGET_OPERATOR"]
          log = Path("mull-results-before-aider/mull-console.log").read_text(encoding="utf-8", errors="replace")
          pattern = re.compile(rf"{re.escape(operator)}:([^:]+):{line}:(\d+):\d+:\d+\s+->\s+(\w+)")
          matches = [(p.replace("\\", "/"), c, s) for p, c, s in pattern.findall(log) if p.replace("\\", "/").endswith(source)]
          if not matches:
              raise SystemExit(f"Target mutant {operator} at line {line} was not found.")
          if not any(status == "Passed" for _, _, status in matches):
              raise SystemExit(f"Target mutant at line {line} does not survive at baseline: {matches}")
          print(f"Confirmed surviving target mutant: {matches}")
          PY

      - name: Generate focused context for Aider
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          source = Path(os.environ["SOURCE_FILE"])
          target = int(os.environ["TARGET_LINE"])
          lines = source.read_text(encoding="utf-8", errors="replace").splitlines()
          start = max(1, target - 12)
          end = min(len(lines), target + 12)
          context = {
              "target_mutant": {
                  "file": source.as_posix(),
                  "line": target,
                  "operator": os.environ["TARGET_OPERATOR"],
                  "mutation": "Replace != with ==",
                  "known_covering_test": "HeartbeatTest.HeartBeat"
              },
              "source_context": [
                  {"line": n, "is_target": n == target, "content": lines[n - 1]}
                  for n in range(start, end + 1)
              ]
          }
          Path("agent-mutant-187-context.json").write_text(
              json.dumps(context, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8"
          )
          PY
          python3 -m json.tool agent-mutant-187-context.json

      - name: Install Aider
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user aider-chat
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Record test baseline before Aider
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          content = Path("test/heartbeat_tests.cpp").read_text(encoding="utf-8")
          count = len(re.findall(r"\bTEST(?:_F|_P)?\s*\(", content))
          Path("baseline-test-count.txt").write_text(f"{count}\n", encoding="utf-8")
          print(f"Existing GoogleTest declaration count: {count}")
          PY

      - name: Analyze and enrich existing heartbeat test with Aider
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          PROMPT=$(cat <<'EOF'
          Analyse le mutant Mull survivant decrit dans agent-mutant-187-context.json.

          Objectif : tuer uniquement le mutant cxx_ne_to_eq situe a la ligne 187 de
          isobus/src/isobus_heartbeat.cpp en enrichissant le test existant
          HeartbeatTest.HeartBeat.

          Tu dois ajouter la verification minimale et deterministe qui passe sur le code
          original et echoue sur le mutant.

          Scenario impose pour atteindre reellement la ligne 187 :
          - le test possede deja une Control Function distante enregistree :
            auto partner = test_helpers::force_claim_partnered_control_function(0xF4, 0) ;
          - son premier heartbeat recu est envoye dans le bloc existant
            "// Supply a heartbeat" avec l'identifiant 0x0CF0E4F4 ;
          - enrichis ce bloc existant au lieu de creer une nouvelle Control Function ;
          - utilise uniquement l'adresse existante 0xF4 et n'invente aucune adresse ;
          - installe le sink CANStackLogger avant ce premier heartbeat recu de 0xF4 ;
          - remplace le premier compteur 251 par 0 ;
          - verifie immediatement que le code original produit un log Warning contenant
            "Initial heartbeat sequence counter not received" et l'adresse "0xF4" ;
          - conserve la verification new_heartbeat_callback_called.

          Reutilisation obligatoire du logger existant :
          - le test contient deja une classe locale TestLogger et un sink utilises pour
            tuer le mutant de la ligne 33 ;
          - deplace cette declaration et l'installation de ce sink avant le bloc
            "// Supply a heartbeat" afin de reutiliser la meme instance ;
          - ne declare pas une deuxieme classe TestLogger ;
          - avant la validation existante de la ligne 33, reinitialise logCalled,
            lastLogText et lastLogLevel pour ne pas reutiliser les logs precedents ;
          - conserve la restauration du sink et du niveau de log a la fin du test.

          Contraintes absolues :
          - modifie uniquement test/heartbeat_tests.cpp ;
          - enrichis uniquement le test existant HeartbeatTest.HeartBeat ;
          - ne cree aucun nouveau TEST, TEST_F ou TEST_P ;
          - ne modifie jamais le code de production ;
          - ne modifie aucun autre fichier ;
          - conserve toutes les validations deja presentes, notamment la boucle du
            compteur 1 a 250 et la validation du mutant de la ligne 33 ;
          - n'utilise aucune attente reelle ;
          - n'ajoute pas de dependance GoogleMock ;
          - n'utilise pas EXPECT_THAT ni HasSubstr ;
          - utilise uniquement les assertions GoogleTest deja disponibles ;
          - ne contourne pas la logique testee et n'affaiblis aucune assertion ;
          - applique la modification minimale necessaire.

          Le fichier de production et le contexte du mutant sont fournis en lecture seule.
          Applique directement la modification dans test/heartbeat_tests.cpp.
          EOF
          )

          aider \
            --model openrouter/nvidia/nemotron-3-ultra-550b-a55b:free \
            --edit-format diff \
            --read agent-mutant-187-context.json \
            --read "${SOURCE_FILE}" \
            --file "${TEST_FILE}" \
            --message "${PROMPT}" \
            --no-gitignore \
            --map-tokens 0 \
            --no-check-update \
            --no-show-release-notes \
            --analytics-disable \
            --chat-history-file "${RUNNER_TEMP}/aider.chat.history.md" \
            --input-history-file "${RUNNER_TEMP}/aider.input.history" \
            --llm-history-file "${RUNNER_TEMP}/aider.llm.history" \
            --no-auto-commits \
            --no-dirty-commits \
            --no-pretty \
            --no-stream \
            --yes-always \
            2>&1 | tee aider-mutant-187-edit.txt

          test -s aider-mutant-187-edit.txt

      - name: Enforce Aider modification boundaries
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- ':(exclude)test/heartbeat_tests.cpp'; then
            echo "Aider modified a tracked file other than test/heartbeat_tests.cpp." >&2
            git diff -- ':(exclude)test/heartbeat_tests.cpp' >&2
            exit 1
          fi
          if git diff --quiet -- test/heartbeat_tests.cpp; then
            echo "Aider did not modify test/heartbeat_tests.cpp." >&2
            exit 1
          fi
          if ! git diff --quiet -- "${SOURCE_FILE}"; then
            echo "Production code was modified." >&2
            exit 1
          fi
          python3 - <<'PY'
          import re
          from pathlib import Path
          path = Path("test/heartbeat_tests.cpp")
          content = path.read_text(encoding="utf-8")
          before = int(Path("baseline-test-count.txt").read_text().strip())
          after = len(re.findall(r"\bTEST(?:_F|_P)?\s*\(", content))
          if after != before:
              raise SystemExit(f"GoogleTest declaration count changed: before={before}, after={after}")
          if not re.search(r"\bTEST_F\s*\(\s*HeartbeatTest\s*,\s*HeartBeat\s*\)", content):
              raise SystemExit("HeartbeatTest.HeartBeat was not found.")
          print(f"GoogleTest declaration count unchanged: {after}")
          PY
          git diff --check
          git diff -- test/heartbeat_tests.cpp | tee aider-mutant-187.patch

      - name: Rebuild unit tests after Aider edit
        shell: bash
        run: |
          set -euo pipefail
          find build -type f -name '*.gcda' -delete
          cmake --build build --parallel
          test -x "${TEST_EXECUTABLE}"

      - name: Run enriched heartbeat test
        shell: bash
        run: |
          set -euo pipefail
          cd build/test
          ./unit_tests --gtest_filter=HeartbeatTest.HeartBeat --gtest_color=no 2>&1 | tee "${GITHUB_WORKSPACE}/heartbeat-test-after-aider.log"

      - name: Run full unit test suite after Aider edit and regenerate coverage
        shell: bash
        env:
          LLVM_PROFILE_FILE: ${{ github.workspace }}/all-tests-after-aider.profraw
        run: |
          set -euo pipefail
          rm -f "${GITHUB_WORKSPACE}/all-tests-after-aider.profraw" "${GITHUB_WORKSPACE}/all-tests-after-aider.profdata"
          cd build/test
          ./unit_tests --gtest_color=no 2>&1 | tee "${GITHUB_WORKSPACE}/all-tests-after-aider.log"
          cd "${GITHUB_WORKSPACE}"
          test -s all-tests-after-aider.profraw
          llvm-profdata-19 merge -sparse all-tests-after-aider.profraw -o all-tests-after-aider.profdata

      - name: Run full Mull campaign after Aider edit
        shell: bash
        env:
          MULL_CONFIG: ${{ github.workspace }}/mull-config.yml
        run: |
          set -euo pipefail
          rm -rf mull-results-after-aider
          mkdir -p mull-results-after-aider
          cd build/test
          mull-runner-19 \
            --allow-surviving \
            --debug \
            --timeout 120000 \
            --coverage-info "${GITHUB_WORKSPACE}/all-tests-after-aider.profdata" \
            --reporters IDE \
            --reporters Elements \
            --report-dir "${GITHUB_WORKSPACE}/mull-results-after-aider" \
            --report-name heartbeat-after-aider-line-187 \
            ./unit_tests \
            --gtest_color=no \
            2>&1 | tee "${GITHUB_WORKSPACE}/mull-results-after-aider/mull-console.log"

      - name: Verify line 187 and report remaining survivors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          source = os.environ["SOURCE_FILE"].replace("\\", "/")
          log = Path("mull-results-after-aider/mull-console.log").read_text(
              encoding="utf-8", errors="replace"
          )
          pattern = re.compile(
              r"(?:^|\s)(cxx_[A-Za-z0-9_]+):"
              r"(.+?):(\d+):(\d+):\d+:\d+\s+->\s+(Passed|Failed)"
          )
          rows = []
          for operator, path, line, column, status in pattern.findall(log):
              normalized = path.replace("\\", "/")
              if normalized.endswith(source):
                  rows.append((operator, int(line), int(column), status))

          target = [
              row for row in rows
              if row[0] == "cxx_ne_to_eq" and row[1] == 187
          ]
          if not target:
              raise SystemExit(
                  "Target mutant cxx_ne_to_eq at line 187 was not parsed "
                  "from the post-edit Mull output."
              )
          if any(row[3] == "Passed" for row in target):
              raise SystemExit(f"Target mutant at line 187 still survives: {target}")

          surviving = sorted(row for row in rows if row[3] == "Passed")
          line_217_survives = any(
              row[0] == "cxx_ne_to_eq" and row[1] == 217
              for row in surviving
          )
          report = [
              "Target mutant line 187: killed.",
              "Mutant line 217: " + ("survives." if line_217_survives else "killed."),
              f"Surviving mutants after Aider: {len(surviving)}",
          ]
          report.extend(str(row) for row in surviving)
          Path("post-aider-mutation-summary.txt").write_text(
              "\n".join(report) + "\n", encoding="utf-8"
          )
          print("\n".join(report))
          PY

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Heartbeat mutant line 187"
            echo
            echo '```text'
            cat post-aider-mutation-summary.txt 2>/dev/null || echo "Final mutation summary was not generated."
            echo '```'
            echo
            echo "## Authorized patch"
            echo
            echo '```diff'
            cat aider-mutant-187.patch 2>/dev/null || echo "Aider patch was not generated."
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mull-heartbeat-mutant-187-edit-and-validation-v3
          path: |
            mull-config.yml
            all-tests-baseline.log
            all-tests.profdata
            mull-results-before-aider/
            agent-mutant-187-context.json
            baseline-test-count.txt
            aider-mutant-187-edit.txt
            aider-mutant-187.patch
            heartbeat-test-after-aider.log
            all-tests-after-aider.log
            all-tests-after-aider.profdata
            mull-results-after-aider/
            post-aider-mutation-summary.txt
          if-no-files-found: warn
          retention-days: 30
