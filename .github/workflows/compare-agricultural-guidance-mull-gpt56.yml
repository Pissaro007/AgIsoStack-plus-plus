name: Compare Mull on AgriculturalGuidanceInterface

on:
  workflow_dispatch:

  push:
    branches:
      - research/agricultural-guidance-plus-gpt56
    paths:
      - ".github/workflows/compare-agricultural-guidance-mull-gpt56.yml"

permissions:
  contents: read

concurrency:
  group: agricultural-guidance-mull-gpt56-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_FILE: isobus/src/isobus_guidance_interface.cpp
  GENERATED_TEST_FILE: test/generated_agricultural_guidance_tests.cpp
  GENERATED_SUITE_PREFIX: AgriculturalGuidanceGeneratedTest.
  EVIDENCE_DIR: agricultural-guidance-mull-comparison-evidence

jobs:
  compare-mull:
    name: Compare human baseline and human plus GPT-5.6
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Create evidence directory
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          mkdir -p "${EVIDENCE_DIR}/mull-results-human"
          mkdir -p "${EVIDENCE_DIR}/mull-results-combined"

      - name: Record experiment identity
        shell: bash
        run: |
          set -o pipefail
          {
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Source file: ${SOURCE_FILE}"
            echo "Generated test file: ${GENERATED_TEST_FILE}"
            echo "Generated suite prefix: ${GENERATED_SUITE_PREFIX}"
            echo "Recorded at: $(date --iso-8601=seconds)"
            echo
            cat /etc/os-release
          } 2>&1 | tee "${EVIDENCE_DIR}/experiment-identity.txt"

      - name: Verify inputs and preserve hashes
        shell: bash
        run: |
          set -euo pipefail

          test -f "${SOURCE_FILE}"
          test -f "${GENERATED_TEST_FILE}"
          test -f test/guidance_tests.cpp
          test -f test/CMakeLists.txt

          if ! grep -Fxq "    generated_agricultural_guidance_tests.cpp" test/CMakeLists.txt; then
            echo "ERROR: generated test is not integrated in test/CMakeLists.txt."
            exit 1
          fi

          cp "${GENERATED_TEST_FILE}" \
            "${EVIDENCE_DIR}/generated_agricultural_guidance_tests-correction-2.cpp.txt"

          sha256sum \
            "${SOURCE_FILE}" \
            "${GENERATED_TEST_FILE}" \
            test/guidance_tests.cpp \
            test/CMakeLists.txt \
            > "${EVIDENCE_DIR}/input-sha256-before.txt"

          git status --short --untracked-files=all \
            | tee "${EVIDENCE_DIR}/git-status-before.txt"

      - name: Install Clang 19 Mull and build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            clang-19 \
            llvm-19 \
            build-essential \
            cmake \
            ninja-build \
            curl

          curl -1sLf \
            "https://dl.cloudsmith.io/public/mull-project/mull-stable/setup.deb.sh" \
            | sudo -E bash

          sudo apt-get update
          sudo apt-get install -y mull-19

      - name: Verify tools
        shell: bash
        run: |
          set -euo pipefail
          {
            clang-19 --version
            echo
            clang++-19 --version
            echo
            llvm-profdata-19 --version
            echo
            mull-runner-19 --version
            echo
            cmake --version
            ninja --version
          } 2>&1 | tee "${EVIDENCE_DIR}/tool-versions.txt"

          test -f /usr/lib/mull-ir-frontend-19

      - name: Create Mull configuration
        shell: bash
        run: |
          set -euo pipefail

          ESCAPED_SOURCE_FILE=$(printf '%s' "${SOURCE_FILE}" | sed 's#[][\\.^$*+?(){}|]#\\&#g')

          cat > mull.yml <<EOF
          includePaths:
            - '.*${ESCAPED_SOURCE_FILE}$'
          excludePaths:
            - '.*googletest.*'
            - '.*googlemock.*'
            - '.*gtest.*'
            - '.*gmock.*'
          quiet: false
          EOF

          cp mull.yml "${EVIDENCE_DIR}/mull.yml"
          cat mull.yml

      - name: Preserve generated tests and create empty human baseline source
        shell: bash
        run: |
          set -euo pipefail
          cp "${GENERATED_TEST_FILE}" /tmp/generated_agricultural_guidance_tests.cpp
          : > "${GENERATED_TEST_FILE}"
          test ! -s "${GENERATED_TEST_FILE}"

      - name: Configure human baseline build
        shell: bash
        env:
          CC: clang-19
          CXX: clang++-19
          MULL_CONFIG: ${{ github.workspace }}/mull.yml
        run: |
          set -euo pipefail
          cmake -S . -B build-mull-human \
            -G Ninja \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_FLAGS="-O0 -g -grecord-command-line -fprofile-instr-generate -fcoverage-mapping -fpass-plugin=/usr/lib/mull-ir-frontend-19" \
            -DCMAKE_CXX_FLAGS="-O0 -g -grecord-command-line -fprofile-instr-generate -fcoverage-mapping -fpass-plugin=/usr/lib/mull-ir-frontend-19" \
            -DCMAKE_EXE_LINKER_FLAGS="-fprofile-instr-generate" \
            2>&1 | tee "${EVIDENCE_DIR}/human-cmake-configure.log"

      - name: Build human baseline
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-mull-human --parallel 2 \
            2>&1 | tee "${EVIDENCE_DIR}/human-build.log"
          test -x build-mull-human/test/unit_tests

      - name: Validate human baseline test inventory
        shell: bash
        working-directory: build-mull-human/test
        run: |
          set -euo pipefail

          ./unit_tests --gtest_list_tests --gtest_color=no \
            > "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/human-gtest-list.txt"

          if grep -q "${GENERATED_SUITE_PREFIX}" \
            "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/human-gtest-list.txt"; then
            echo "ERROR: generated GPT-5.6 tests are present in the human baseline executable."
            exit 1
          fi

      - name: Run human baseline tests and create profile
        shell: bash
        working-directory: build-mull-human/test
        env:
          LLVM_PROFILE_FILE: ${{ github.workspace }}/human.profraw
        run: |
          set -euo pipefail

          rm -f "${GITHUB_WORKSPACE}/human.profraw" "${GITHUB_WORKSPACE}/human.profdata"

          ./unit_tests --gtest_color=no \
            2>&1 | tee "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/human-tests.log"

          test -s "${GITHUB_WORKSPACE}/human.profraw"

          llvm-profdata-19 merge \
            -sparse \
            "${GITHUB_WORKSPACE}/human.profraw" \
            -o "${GITHUB_WORKSPACE}/human.profdata"

          test -s "${GITHUB_WORKSPACE}/human.profdata"

          TEST_COUNT=$(grep -c '^\[ RUN      \]' \
            "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/human-tests.log" || true)
          echo "${TEST_COUNT}" > "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/human-test-count.txt"

          if [ "${TEST_COUNT}" -ne 183 ]; then
            echo "ERROR: expected 183 human tests, observed ${TEST_COUNT}."
            exit 1
          fi

      - name: Run Mull human baseline
        shell: bash
        working-directory: build-mull-human/test
        env:
          MULL_CONFIG: ${{ github.workspace }}/mull.yml
        run: |
          set -euo pipefail

          mull-runner-19 \
            --allow-surviving \
            --debug \
            --timeout 120000 \
            --coverage-info "${GITHUB_WORKSPACE}/human.profdata" \
            --reporters IDE \
            --reporters Elements \
            --report-dir "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/mull-results-human" \
            --report-name agricultural-guidance-human \
            ./unit_tests \
            --gtest_color=no \
            2>&1 | tee "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/mull-results-human/mull-console.log"

      - name: Restore generated tests
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/generated_agricultural_guidance_tests.cpp "${GENERATED_TEST_FILE}"
          cmp -s /tmp/generated_agricultural_guidance_tests.cpp "${GENERATED_TEST_FILE}"

      - name: Configure combined build
        shell: bash
        env:
          CC: clang-19
          CXX: clang++-19
          MULL_CONFIG: ${{ github.workspace }}/mull.yml
        run: |
          set -euo pipefail
          cmake -S . -B build-mull-combined \
            -G Ninja \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_FLAGS="-O0 -g -grecord-command-line -fprofile-instr-generate -fcoverage-mapping -fpass-plugin=/usr/lib/mull-ir-frontend-19" \
            -DCMAKE_CXX_FLAGS="-O0 -g -grecord-command-line -fprofile-instr-generate -fcoverage-mapping -fpass-plugin=/usr/lib/mull-ir-frontend-19" \
            -DCMAKE_EXE_LINKER_FLAGS="-fprofile-instr-generate" \
            2>&1 | tee "${EVIDENCE_DIR}/combined-cmake-configure.log"

      - name: Build combined suite
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-mull-combined --parallel 2 \
            2>&1 | tee "${EVIDENCE_DIR}/combined-build.log"
          test -x build-mull-combined/test/unit_tests

      - name: Validate combined test inventory
        shell: bash
        working-directory: build-mull-combined/test
        run: |
          set -euo pipefail

          ./unit_tests --gtest_list_tests --gtest_color=no \
            > "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/combined-gtest-list.txt"

          GENERATED_COUNT=$(grep -c '^  ' \
            "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/combined-gtest-list.txt" || true)

          if ! grep -q '^AgriculturalGuidanceGeneratedTest\.$' \
            "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/combined-gtest-list.txt"; then
            echo "ERROR: generated GPT-5.6 test suite is absent from combined executable."
            exit 1
          fi

      - name: Run combined tests and create profile
        shell: bash
        working-directory: build-mull-combined/test
        env:
          LLVM_PROFILE_FILE: ${{ github.workspace }}/combined.profraw
        run: |
          set -euo pipefail

          rm -f "${GITHUB_WORKSPACE}/combined.profraw" "${GITHUB_WORKSPACE}/combined.profdata"

          ./unit_tests --gtest_color=no \
            2>&1 | tee "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/combined-tests.log"

          test -s "${GITHUB_WORKSPACE}/combined.profraw"

          llvm-profdata-19 merge \
            -sparse \
            "${GITHUB_WORKSPACE}/combined.profraw" \
            -o "${GITHUB_WORKSPACE}/combined.profdata"

          test -s "${GITHUB_WORKSPACE}/combined.profdata"

          TEST_COUNT=$(grep -c '^\[ RUN      \]' \
            "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/combined-tests.log" || true)
          echo "${TEST_COUNT}" > "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/combined-test-count.txt"

          if [ "${TEST_COUNT}" -ne 202 ]; then
            echo "ERROR: expected 202 combined tests, observed ${TEST_COUNT}."
            exit 1
          fi

      - name: Run Mull combined suite
        shell: bash
        working-directory: build-mull-combined/test
        env:
          MULL_CONFIG: ${{ github.workspace }}/mull.yml
        run: |
          set -euo pipefail

          mull-runner-19 \
            --allow-surviving \
            --debug \
            --timeout 120000 \
            --coverage-info "${GITHUB_WORKSPACE}/combined.profdata" \
            --reporters IDE \
            --reporters Elements \
            --report-dir "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/mull-results-combined" \
            --report-name agricultural-guidance-combined \
            ./unit_tests \
            --gtest_color=no \
            2>&1 | tee "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/mull-results-combined/mull-console.log"

      - name: Parse and compare Mull results
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import csv
          import json
          import os
          import re
          from pathlib import Path

          source_file = os.environ["SOURCE_FILE"].replace("\\", "/")
          evidence = Path(os.environ["EVIDENCE_DIR"])

          ide_pattern = re.compile(
              r"^(.*?):(\d+):(\d+):\s+"
              r"(?:warning|remark|note|info):\s+"
              r"(Killed|Survived|Timeout|Timedout|Passed|Failed):\s+"
              r"(.*?)\s+\[([^\]]+)\]\s*$",
              re.IGNORECASE,
          )

          def normalize_status(value):
              status = value.lower()
              if status in {"killed", "failed"}:
                  return "Killed"
              if status in {"survived", "passed"}:
                  return "Survived"
              return "Timeout"

          def parse_found_count(text):
              patterns = [
                  r"(?:Generated|Created|Found|Total|Applied)\s+(?:mutations|mutants)\s*[:=]\s*(\d+)",
                  r"(?:mutations|mutants)\s+(?:generated|created|found|applied)\s*[:=]?\s*(\d+)",
                  r"Applied mutations:\s*(\d+)",
              ]
              values = []
              for pattern in patterns:
                  for match in re.finditer(pattern, text, re.IGNORECASE):
                      values.append(int(match.group(1)))
              return max(values) if values else None

          def parse_log(path):
              text = Path(path).read_text(encoding="utf-8", errors="replace")
              mutants = {}
              for raw_line in text.splitlines():
                  match = ide_pattern.match(raw_line.strip())
                  if not match:
                      continue
                  path_value, line, column, status, description, operator = match.groups()
                  normalized_path = path_value.replace("\\", "/")
                  if not normalized_path.endswith(source_file):
                      continue
                  key = (
                      int(line),
                      int(column),
                      operator.strip(),
                      description.strip(),
                  )
                  mutants[key] = normalize_status(status)
              return text, mutants, parse_found_count(text)

          human_text, human, human_found = parse_log(
              evidence / "mull-results-human" / "mull-console.log"
          )
          combined_text, combined, combined_found = parse_log(
              evidence / "mull-results-combined" / "mull-console.log"
          )

          all_keys = sorted(set(human) | set(combined))
          rows = []
          for key in all_keys:
              line, column, operator, description = key
              human_status = human.get(key, "Not covered or not reported")
              combined_status = combined.get(key, "Not covered or not reported")
              newly_covered = (
                  human_status == "Not covered or not reported"
                  and combined_status != "Not covered or not reported"
              )
              newly_killed = (
                  human_status != "Killed"
                  and combined_status == "Killed"
              )
              survivor_to_killed = (
                  human_status == "Survived"
                  and combined_status == "Killed"
              )
              rows.append({
                  "line": line,
                  "column": column,
                  "operator": operator,
                  "description": description,
                  "human_status": human_status,
                  "combined_status": combined_status,
                  "newly_covered_by_gpt56": "yes" if newly_covered else "no",
                  "newly_killed_by_gpt56": "yes" if newly_killed else "no",
                  "human_survivor_killed_by_gpt56": "yes" if survivor_to_killed else "no",
              })

          csv_path = evidence / "mull-mutant-comparison.csv"
          with csv_path.open("w", newline="", encoding="utf-8") as output:
              writer = csv.DictWriter(output, fieldnames=list(rows[0].keys()) if rows else [
                  "line", "column", "operator", "description", "human_status",
                  "combined_status", "newly_covered_by_gpt56",
                  "newly_killed_by_gpt56", "human_survivor_killed_by_gpt56",
              ])
              writer.writeheader()
              writer.writerows(rows)

          def stats(mutants, found):
              values = list(mutants.values())
              killed = sum(value == "Killed" for value in values)
              survived = sum(value == "Survived" for value in values)
              timeout = sum(value == "Timeout" for value in values)
              covered = killed + survived + timeout
              return {
                  "found": found,
                  "covered": covered,
                  "killed": killed,
                  "survived": survived,
                  "timeout": timeout,
              }

          human_stats = stats(human, human_found)
          combined_stats = stats(combined, combined_found)
          newly_covered_count = sum(row["newly_covered_by_gpt56"] == "yes" for row in rows)
          newly_killed_count = sum(row["newly_killed_by_gpt56"] == "yes" for row in rows)
          survivor_to_killed_count = sum(
              row["human_survivor_killed_by_gpt56"] == "yes" for row in rows
          )

          summary = {
              "source_file": source_file,
              "human": human_stats,
              "combined": combined_stats,
              "newly_covered_by_gpt56": newly_covered_count,
              "newly_killed_by_gpt56": newly_killed_count,
              "human_survivors_killed_by_gpt56": survivor_to_killed_count,
              "human_reported_mutant_identities": len(human),
              "combined_reported_mutant_identities": len(combined),
              "reported_identity_sets_equal": set(human) == set(combined),
          }

          (evidence / "mull-comparison-summary.json").write_text(
              json.dumps(summary, indent=2), encoding="utf-8"
          )

          def value(value):
              return "not parsed" if value is None else str(value)

          report = [
              "# AgriculturalGuidanceInterface Mull comparison",
              "",
              f"Source: `{source_file}`",
              "",
              "## Human baseline",
              "",
              f"- Mutants found: {value(human_stats['found'])}",
              f"- Mutants covered: {human_stats['covered']}",
              f"- Mutants killed: {human_stats['killed']}",
              f"- Mutants surviving: {human_stats['survived']}",
              f"- Mutants timed out: {human_stats['timeout']}",
              "",
              "## Human plus GPT-5.6",
              "",
              f"- Mutants found: {value(combined_stats['found'])}",
              f"- Mutants covered: {combined_stats['covered']}",
              f"- Mutants killed: {combined_stats['killed']}",
              f"- Mutants surviving: {combined_stats['survived']}",
              f"- Mutants timed out: {combined_stats['timeout']}",
              "",
              "## Differential contribution",
              "",
              f"- Mutants newly covered by GPT-5.6: {newly_covered_count}",
              f"- Mutants newly killed by GPT-5.6: {newly_killed_count}",
              f"- Human survivors killed by GPT-5.6: {survivor_to_killed_count}",
              f"- Reported mutant identity sets equal: {set(human) == set(combined)}",
              "",
              "`Not covered or not reported` means that the IDE reporter did not emit a status for that mutant in that campaign.",
              "Use the raw Mull logs to verify the total number of mutants found if automatic parsing reports `not parsed`.",
          ]

          for row in rows:
              if (
                  row["newly_covered_by_gpt56"] == "yes"
                  or row["newly_killed_by_gpt56"] == "yes"
                  or row["human_status"] != row["combined_status"]
              ):
                  report.extend([
                      "",
                      f"### Line {row['line']}, column {row['column']}",
                      "",
                      f"- Operator: `{row['operator']}`",
                      f"- Description: {row['description']}",
                      f"- Human: {row['human_status']}",
                      f"- Human plus GPT-5.6: {row['combined_status']}",
                  ])

          report_text = "\n".join(report) + "\n"
          (evidence / "mull-comparison-summary.md").write_text(
              report_text, encoding="utf-8"
          )
          print(report_text)
          PY

      - name: Verify repository integrity
        if: always()
        shell: bash
        run: |
          set +e

          if [ -f /tmp/generated_agricultural_guidance_tests.cpp ]; then
            cp /tmp/generated_agricultural_guidance_tests.cpp "${GENERATED_TEST_FILE}"
          fi

          sha256sum \
            "${SOURCE_FILE}" \
            "${GENERATED_TEST_FILE}" \
            test/guidance_tests.cpp \
            test/CMakeLists.txt \
            > "${EVIDENCE_DIR}/input-sha256-after.txt"

          if cmp -s \
            "${EVIDENCE_DIR}/input-sha256-before.txt" \
            "${EVIDENCE_DIR}/input-sha256-after.txt"; then
            echo "Production source, generated test, human guidance tests, and CMake integration are unchanged." \
              > "${EVIDENCE_DIR}/repository-integrity.txt"
          else
            echo "WARNING: at least one experimental input changed." \
              > "${EVIDENCE_DIR}/repository-integrity-warning.txt"
          fi

          git status --short --untracked-files=all \
            > "${EVIDENCE_DIR}/git-status-after.txt"

      - name: Add comparison to workflow summary
        if: always()
        shell: bash
        run: |
          if [ -f "${EVIDENCE_DIR}/mull-comparison-summary.md" ]; then
            cat "${EVIDENCE_DIR}/mull-comparison-summary.md" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Mull comparison summary was not generated." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload Mull comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agricultural-guidance-mull-human-vs-gpt56
          if-no-files-found: warn
          retention-days: 30
          path: |
            agricultural-guidance-mull-comparison-evidence/
            human.profdata
            combined.profdata
