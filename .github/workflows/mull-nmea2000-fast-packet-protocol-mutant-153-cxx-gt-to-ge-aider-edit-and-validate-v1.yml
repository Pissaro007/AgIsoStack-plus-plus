name: Mull - Edit and Validate NMEA2000 Fast Packet Mutant Line 153 with Aider v1

on:
  workflow_dispatch:
    inputs:
      source_file:
        description: "Chemin du fichier source a muter"
        required: true
        default: "isobus/src/nmea2000_fast_packet_protocol.cpp"
        type: string

  push:
    branches:
      - quality/mull-nmea2000-fast-packet-protocol
    paths:
      - .github/workflows/mull-nmea2000-fast-packet-protocol-mutant-153-cxx-gt-to-ge-aider-edit-and-validate-v1.yml

permissions:
  contents: read

env:
  SOURCE_FILE: ${{ inputs.source_file || 'isobus/src/nmea2000_fast_packet_protocol.cpp' }}
  SOURCE_HEADER: isobus/include/isobus/isobus/nmea2000_fast_packet_protocol.hpp
  TEST_FILE: test/nmea2000_message_tests.cpp
  TEST_EXECUTABLE: build/test/unit_tests
  TARGET_LINE: "153"
  TARGET_OPERATOR: cxx_gt_to_ge
  TARGET_TEST: NMEA2000Test.NMEA2KInterface
  MULL_CONFIG: ${{ github.workspace }}/mull-config.yml

jobs:
  mutation-testing:
    name: Enrich existing NMEA2000 test and validate mutant line 153
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Clang 19 Mull and build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang-19 llvm-19 build-essential cmake ninja-build curl python3-pip
          curl -1sLf "https://dl.cloudsmith.io/public/mull-project/mull-stable/setup.deb.sh" | sudo -E bash
          sudo apt-get update
          sudo apt-get install -y mull-19

      - name: Verify tools and input files
        shell: bash
        run: |
          set -euo pipefail
          clang-19 --version
          llvm-profdata-19 --version
          llvm-cov-19 --version
          mull-runner-19 --version
          test -f /usr/lib/mull-ir-frontend-19
          test -f "${SOURCE_FILE}"
          test -f "${SOURCE_HEADER}"
          test -f "${TEST_FILE}"

      - name: Create Mull configuration
        shell: bash
        run: |
          set -euo pipefail
          ESCAPED_SOURCE_FILE=$(printf '%s' "${SOURCE_FILE}" | sed 's#[][\\.^$*+?(){}|]#\\&#g')
          cat > "${MULL_CONFIG}" <<EOF
          includePaths:
            - '.*${ESCAPED_SOURCE_FILE}$'
          excludePaths:
            - '.*googletest.*'
            - '.*googlemock.*'
            - '.*gtest.*'
            - '.*gmock.*'
          quiet: false
          EOF
          cat "${MULL_CONFIG}"

      - name: Configure tests for Mull and LLVM coverage
        shell: bash
        env:
          CC: clang-19
          CXX: clang++-19
        run: |
          set -euo pipefail
          cmake -S . -B build \
            -G Ninja \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_FLAGS="-O0 -g -grecord-command-line -fprofile-instr-generate -fcoverage-mapping -fpass-plugin=/usr/lib/mull-ir-frontend-19" \
            -DCMAKE_CXX_FLAGS="-O0 -g -grecord-command-line -fprofile-instr-generate -fcoverage-mapping -fpass-plugin=/usr/lib/mull-ir-frontend-19" \
            -DCMAKE_EXE_LINKER_FLAGS="-fprofile-instr-generate"

      - name: Compile unit tests
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --parallel
          test -x "${TEST_EXECUTABLE}"

      - name: Run baseline unit test suite and generate coverage
        shell: bash
        env:
          LLVM_PROFILE_FILE: ${{ github.workspace }}/all-tests.profraw
        run: |
          set -euo pipefail
          rm -f all-tests.profraw all-tests.profdata
          cd build/test
          ./unit_tests --gtest_color=no 2>&1 | tee "${GITHUB_WORKSPACE}/all-tests-baseline.log"
          cd "${GITHUB_WORKSPACE}"
          test -s all-tests.profraw
          llvm-profdata-19 merge -sparse all-tests.profraw -o all-tests.profdata
          test -s all-tests.profdata

      - name: Run baseline Mull campaign on the whole source file
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mull-results-before-aider
          mkdir -p mull-results-before-aider
          cd build/test
          mull-runner-19 \
            --allow-surviving \
            --debug \
            --timeout 120000 \
            --coverage-info "${GITHUB_WORKSPACE}/all-tests.profdata" \
            --reporters IDE \
            --reporters Elements \
            --report-dir "${GITHUB_WORKSPACE}/mull-results-before-aider" \
            --report-name nmea2000-fast-packet-before-aider \
            ./unit_tests \
            --gtest_color=no \
            2>&1 | tee "${GITHUB_WORKSPACE}/mull-results-before-aider/mull-console.log"

      - name: Verify target mutant survives before Aider
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          source = os.environ["SOURCE_FILE"].replace("\\", "/")
          line = os.environ["TARGET_LINE"]
          operator = os.environ["TARGET_OPERATOR"]
          log = Path("mull-results-before-aider/mull-console.log").read_text(
              encoding="utf-8", errors="replace"
          )
          pattern = re.compile(
              rf"{re.escape(operator)}:([^:]+):{line}:(\d+):\d+:\d+\s+->\s+(\w+)"
          )
          matches = [
              (path.replace("\\", "/"), column, status)
              for path, column, status in pattern.findall(log)
              if path.replace("\\", "/").endswith(source)
          ]
          if not matches:
              raise SystemExit(
                  f"Target mutant {operator} at line {line} was not found."
              )
          if not any(status == "Passed" for _, _, status in matches):
              raise SystemExit(
                  f"Target mutant at line {line} does not survive at baseline: {matches}"
              )
          print(f"Confirmed surviving target mutant: {matches}")
          PY

      - name: Generate focused context for Aider
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          source = Path(os.environ["SOURCE_FILE"])
          target = int(os.environ["TARGET_LINE"])
          lines = source.read_text(encoding="utf-8", errors="replace").splitlines()
          start = max(1, target - 12)
          end = min(len(lines), target + 12)
          context = {
              "target_mutant": {
                  "file": source.as_posix(),
                  "line": target,
                  "operator": os.environ["TARGET_OPERATOR"],
                  "mutation": "Replace > with >=",
                  "known_covering_test": os.environ["TARGET_TEST"],
              },
              "source_context": [
                  {"line": number, "is_target": number == target, "content": lines[number - 1]}
                  for number in range(start, end + 1)
              ],
          }
          Path("agent-mutant-153-context.json").write_text(
              json.dumps(context, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
          python3 -m json.tool agent-mutant-153-context.json

      - name: Install Aider
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user aider-chat
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Record test baseline before Aider
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          content = Path("test/nmea2000_message_tests.cpp").read_text(encoding="utf-8")
          count = len(re.findall(r"\bTEST(?:_F|_P)?\s*\(", content))
          Path("baseline-test-count.txt").write_text(f"{count}\n", encoding="utf-8")
          print(f"Existing GoogleTest declaration count: {count}")
          PY

      - name: Analyze and enrich existing NMEA2000 test with Aider
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          PROMPT=$(cat <<'EOF'
          Analyse le mutant Mull survivant decrit dans agent-mutant-153-context.json.

          Objectif : tuer uniquement le mutant cxx_gt_to_ge situe a la ligne 153 de
          isobus/src/nmea2000_fast_packet_protocol.cpp en enrichissant le test existant
          NMEA2000Test.NMEA2KInterface.

          Le mutant remplace la verification data->size() >
          MAX_PROTOCOL_MESSAGE_LENGTH par data->size() >=
          MAX_PROTOCOL_MESSAGE_LENGTH dans
          FastPacketProtocol::send_multipacket_message(). La longueur maximale autorisee
          par le protocole est 223 octets. Le code original doit donc accepter exactement
          223 octets, tandis que le mutant les refuse.

          Le test contient deja les enrichissements valides suivants :
          - les assertions de limites de calculate_number_of_frames() qui tuent le mutant
            cxx_gt_to_le de la ligne 93 ;
          - une instance locale FastPacketProtocol avec un callback d'envoi valide ;
          - une verification qu'un payload de 8 octets est refusee, qui tue le mutant
            cxx_le_to_lt de la ligne 153.

          Reutilise cette instance FastPacketProtocol existante et le test existant. Ajoute
          une charge utile de exactement 223 octets, puis verifie avec EXPECT_TRUE ou
          ASSERT_TRUE que send_multipacket_message() l'accepte avec un PGN valide compris
          entre 0x1F000 et 0x1FFFF, la Control Function testECU valide et une destination
          nullptr. Appelle ensuite fastPacketProtocol.update() afin de traiter et fermer la
          session acceptee, pour ne laisser aucun etat actif dans le test.

          N'utilise pas 224 comme argument de longueur : messageLength est un uint8_t et le
          mutant cible concerne la frontiere exacte 223. N'accede pas aux constantes
          privees FastPacketProtocol::MAX_PROTOCOL_MESSAGE_LENGTH ou FP_MIN/FP_MAX depuis
          le test. Utilise directement la valeur de frontiere 223 et un PGN valide deja
          coherent avec le test.

          Etat valide a conserver :
          - conserve integralement tous les scenarios et toutes les assertions existantes
            de NMEA2000Test.NMEA2KInterface ;
          - conserve les enrichissements qui tuent deja les mutants des lignes 93 et 153
            cxx_le_to_lt ;
          - conserve les scenarios COG/SOG, Datum, GNSS Position Data, Position Delta,
            Position Rapid Update, Rate Of Turn et Vessel Heading ;
          - conserve le nettoyage final CANHardwareInterface::stop().

          Contraintes absolues :
          - modifie uniquement test/nmea2000_message_tests.cpp ;
          - enrichis uniquement le test existant NMEA2000Test.NMEA2KInterface ;
          - ne modifie aucun autre test du fichier ;
          - ne cree aucun nouveau TEST, TEST_F ou TEST_P ;
          - ne modifie jamais le code de production ni le header de production ;
          - ne modifie aucun autre fichier ;
          - n'affaiblis, ne supprime et ne remplace aucune assertion existante ;
          - n'invente aucune classe, methode, constante, enumeration ou fonction ;
          - n'utilise aucune attente reelle ;
          - n'ajoute aucune dependance GoogleMock ;
          - utilise uniquement les API publiques et les assertions GoogleTest deja
            disponibles ;
          - applique la modification minimale necessaire ;
          - le patch genere doit etre autonome et compiler sans modification manuelle.

          Le fichier de production, son header et le contexte du mutant sont fournis en
          lecture seule. Le fichier test/nmea2000_message_tests.cpp est fourni en edition
          et contient l'etat valide actuel. Genere et applique toi-meme le patch uniquement
          dans ce fichier.
          EOF
          )

          aider \
            --model openrouter/nvidia/nemotron-3-ultra-550b-a55b:free \
            --edit-format diff \
            --read agent-mutant-153-context.json \
            --read "${SOURCE_FILE}" \
            --read "${SOURCE_HEADER}" \
            --file "${TEST_FILE}" \
            --message "${PROMPT}" \
            --no-gitignore \
            --map-tokens 0 \
            --no-check-update \
            --no-show-release-notes \
            --analytics-disable \
            --chat-history-file "${RUNNER_TEMP}/aider.chat.history.md" \
            --input-history-file "${RUNNER_TEMP}/aider.input.history" \
            --llm-history-file "${RUNNER_TEMP}/aider.llm.history" \
            --no-auto-commits \
            --no-dirty-commits \
            --no-pretty \
            --no-stream \
            --yes-always \
            2>&1 | tee aider-mutant-153-edit.txt

          test -s aider-mutant-153-edit.txt

      - name: Enforce Aider modification boundaries
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet -- ':(exclude)test/nmea2000_message_tests.cpp'; then
            echo "Aider modified a tracked file other than test/nmea2000_message_tests.cpp." >&2
            git diff -- ':(exclude)test/nmea2000_message_tests.cpp' >&2
            exit 1
          fi

          if git diff --quiet -- test/nmea2000_message_tests.cpp; then
            echo "Aider did not modify test/nmea2000_message_tests.cpp." >&2
            exit 1
          fi

          if ! git diff --quiet -- "${SOURCE_FILE}"; then
            echo "Production source code was modified." >&2
            exit 1
          fi

          if ! git diff --quiet -- "${SOURCE_HEADER}"; then
            echo "Production header was modified." >&2
            exit 1
          fi

          if grep -qE \
            'FastPacketProtocol::(FP_|MAX_PROTOCOL_MESSAGE_LENGTH|PROTOCOL_BYTES_PER_FRAME)' \
            "${TEST_FILE}"; then
            echo "Aider accessed private FastPacketProtocol constants." >&2
            exit 1
          fi

          if grep -q 'FastPacketProtocol::calculate_number_of_frames' "${TEST_FILE}"; then
            if ! grep -qF \
              '#include "isobus/isobus/nmea2000_fast_packet_protocol.hpp"' \
              "${TEST_FILE}"; then
              echo "Aider uses FastPacketProtocol without including its real header." >&2
              exit 1
            fi
          fi

          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("test/nmea2000_message_tests.cpp")
          content = path.read_text(encoding="utf-8")
          before = int(Path("baseline-test-count.txt").read_text().strip())
          after = len(re.findall(r"\bTEST(?:_F|_P)?\s*\(", content))

          if after != before:
              raise SystemExit(
                  f"GoogleTest declaration count changed: before={before}, after={after}"
              )

          if not re.search(
              r"\bTEST_F\s*\(\s*NMEA2000Test\s*,\s*NMEA2KInterface\s*\)",
              content,
          ):
              raise SystemExit("NMEA2000Test.NMEA2KInterface was not found.")

          if "FastPacketProtocol::calculate_number_of_frames(7)" not in content:
              raise SystemExit(
                  "The existing boundary check for message length 7 was removed."
              )

          if not re.search(
              r"send_multipacket_message\s*\([^;]*?\b223\b",
              content,
              re.DOTALL,
          ):
              raise SystemExit(
                  "No Fast Packet send boundary scenario using length 223 was found."
              )

          print(f"GoogleTest declaration count unchanged: {after}")
          PY

          git diff --check
          git diff -- test/nmea2000_message_tests.cpp | tee aider-mutant-153.patch

      - name: Rebuild unit tests after Aider edit
        shell: bash
        run: |
          set -euo pipefail
          find build -type f \( -name '*.gcda' -o -name '*.gcno' \) -delete
          cmake --build build --parallel
          test -x "${TEST_EXECUTABLE}"

      - name: Run enriched NMEA2000 test
        shell: bash
        run: |
          set -euo pipefail
          find build -type f -name '*.gcda' -delete
          cd build/test
          ./unit_tests \
            --gtest_filter=NMEA2000Test.NMEA2KInterface \
            --gtest_color=no \
            2>&1 | tee "${GITHUB_WORKSPACE}/nmea2000-test-after-aider.log"

      - name: Run full unit test suite after Aider edit and regenerate coverage
        shell: bash
        env:
          LLVM_PROFILE_FILE: ${{ github.workspace }}/all-tests-after-aider.profraw
        run: |
          set -euo pipefail
          rm -f "${GITHUB_WORKSPACE}/all-tests-after-aider.profraw" \
                "${GITHUB_WORKSPACE}/all-tests-after-aider.profdata"
          cd build/test
          ./unit_tests --gtest_color=no 2>&1 | tee "${GITHUB_WORKSPACE}/all-tests-after-aider.log"
          cd "${GITHUB_WORKSPACE}"
          test -s all-tests-after-aider.profraw
          llvm-profdata-19 merge \
            -sparse \
            all-tests-after-aider.profraw \
            -o all-tests-after-aider.profdata

      - name: Run full Mull campaign after Aider edit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mull-results-after-aider
          mkdir -p mull-results-after-aider
          cd build/test
          mull-runner-19 \
            --allow-surviving \
            --debug \
            --timeout 120000 \
            --coverage-info "${GITHUB_WORKSPACE}/all-tests-after-aider.profdata" \
            --reporters IDE \
            --reporters Elements \
            --report-dir "${GITHUB_WORKSPACE}/mull-results-after-aider" \
            --report-name nmea2000-fast-packet-after-aider-line-153 \
            ./unit_tests \
            --gtest_color=no \
            2>&1 | tee "${GITHUB_WORKSPACE}/mull-results-after-aider/mull-console.log"

      - name: Verify line 153 and report remaining survivors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          source = os.environ["SOURCE_FILE"].replace("\\", "/")
          log = Path("mull-results-after-aider/mull-console.log").read_text(
              encoding="utf-8", errors="replace"
          )
          pattern = re.compile(
              r"(?:^|\s)(cxx_[A-Za-z0-9_]+):"
              r"(.+?):(\d+):(\d+):\d+:\d+\s+->\s+(Passed|Failed)"
          )
          rows = []
          for operator, path, line, column, status in pattern.findall(log):
              normalized = path.replace("\\", "/")
              if normalized.endswith(source):
                  rows.append((operator, int(line), int(column), status))

          target = [
              row for row in rows
              if row[0] == "cxx_gt_to_ge" and row[1] == 153
          ]
          if not target:
              raise SystemExit(
                  "Target mutant cxx_gt_to_ge at line 153 was not parsed from the "
                  "post-edit Mull output."
              )
          if any(row[3] == "Passed" for row in target):
              raise SystemExit(f"Target mutant at line 153 still survives: {target}")

          surviving = sorted(row for row in rows if row[3] == "Passed")
          report = [
              "Target mutant line 153: killed.",
              f"Surviving mutants after Aider: {len(surviving)}",
          ]
          report.extend(str(row) for row in surviving)
          Path("post-aider-mutation-summary.txt").write_text(
              "\n".join(report) + "\n", encoding="utf-8"
          )
          print("\n".join(report))
          PY

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo "## NMEA2000 Fast Packet mutant line 153"
            echo
            echo '```text'
            cat post-aider-mutation-summary.txt 2>/dev/null || \
              echo "Final mutation summary was not generated."
            echo '```'
            echo
            echo "## Authorized patch"
            echo
            echo '```diff'
            cat aider-mutant-153.patch 2>/dev/null || \
              echo "Aider patch was not generated."
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mull-nmea2000-fast-packet-mutant-153-edit-and-validation-v1
          path: |
            mull-config.yml
            all-tests-baseline.log
            all-tests.profdata
            mull-results-before-aider/
            agent-mutant-153-context.json
            baseline-test-count.txt
            aider-mutant-153-edit.txt
            aider-mutant-153.patch
            nmea2000-test-after-aider.log
            all-tests-after-aider.log
            all-tests-after-aider.profdata
            mull-results-after-aider/
            post-aider-mutation-summary.txt
          if-no-files-found: warn
          retention-days: 30
